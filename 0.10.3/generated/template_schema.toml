# ==============================================================================
# Protostar Template Specification Schema
# ==============================================================================

# Informational template version.
version = "1.0.0"

# Typed dependency-group include edges.
dependency_includes = [
    {group = "dev", include = "docs"},
]

# Human-readable display name of the template.
name = "FastAPI"

# Short explanation of the template stack and purpose.
description = "FastAPI web application scaffold with Uvicorn and Pydantic"

# --- Dependencies ---
# Core runtime packages installed into the project environment.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

# Documentation toolchain dependencies.
docs_dependencies = [
    "mkdocstrings[python]",
    "zensical",
]

# --- Directory Architecture ---
# Relative directory paths scaffolded in the workspace.
directories = [
    "src/<% PACKAGE_NAME %>",
    "tests",
    "data/raw",
]

# --- Version Control Ignores ---
# Patterns appended and deduplicated in .gitignore.
vcs_ignores = [
    "*.log",
    ".env",
    "local_data/",
]

# --- Subprocess Tasks ---
# Commands run once the project's files are written, before its dependencies are installed. A task is an argument array, or a table that also lists the files the command writes (owned_files), so a failed run restores them.
system_tasks = [
    {command = ["git", "lfs", "install", "--local"], owned_files = [".git/config"]},
]

# Commands run after the project's dependencies are installed, in the same form as system_tasks.
post_install_tasks = [
    {command = ["uv", "run", "nbdime", "config-git", "--enable"], owned_files = [".git/config"]},
]

# --- Tooling Opinions & Overrides ---
# Boolean toggles configuring baseline tooling opinions.
# A project's own choices win over the tier, the tier over these, and these over the user's defaults.
agents = false
ci = false
codecov = false
commitizen = false
community = false
direnv = false
docker = false
just = false
markdownlint = false
pre_commit = false
prek = false
pyrefly = false
readthedocs = false
release = false
renovate = false
ruff = true
rumdl = false
ty = false
zensical = false

# The tier a project follows until it chooses one; requires [tiers].
tier = "workbench"

# --- Static File Injections ---
# Exact file paths mapped to their raw template contents.

[files]
"README.md" = '''
# <% PROJECT_NAME %>

Auto-scaffolded using custom template.
'''
"src/<% PACKAGE_NAME %>/__init__.py" = '''
"""<% PROJECT_NAME %> package."""
__version__ = "0.1.0"
'''
"src/<% PACKAGE_NAME %>/config.py" = '''
"""Settings for <% PROJECT_NAME %>, maintained by <% ORGANIZATION %>."""
'''
"compose.yaml" = '''
services: {}
'''

# --- Development Environment ([dev]) ---

[dev]
# Development packages installed whichever tools are on. A tool's own packages go in an [[optional]] block that requires it.
dev_dependencies = [
    "ipython",
]

# --- pyproject.toml AST Injections ---
# Named pyproject.toml payloads. A payload is a TOML string, or a table with `content` and an optional `requires` condition that injects it only while the condition holds. Project fields such as description and authors are written once and then belong to the project; dependency tables and tool.protostar can't be set here.

[dev.pyproject]
build_backend = '''
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
'''

[dev.pyproject.custom_linting]
requires = "ruff"
content = '''
[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
'''

# --- File Appends ---
# Named non-TOML regions with stable IDs, content, and an optional requires condition.

[appends.".envrc".project_environment]
content = "export REGION=<% REGION %>"

# --- Options ---
# Choices the template offers. A bool option declares a bool default; a choice option declares its choices and a default among them. Content opts in with requires; an option never renders into text.

[options.database]
description = "The database the service uses."
choices = ["none", "postgres", "sqlite"]
default = "none"

[options.compose]
description = "Ship a compose.yaml."
default = false

# --- Optional Content ---
# Content that applies only while its requires condition holds: a tool, a bool option, or option=value, or an array of them that must all hold. Files are template paths, or every file under a path ending in "/"; content listed by several blocks applies while any of them holds.

[[optional]]
requires = "pytest"
dev_dependencies = ["pytest-cov"]

[[optional]]
requires = "database=postgres"
dependencies = ["psycopg[binary]"]

[[optional]]
requires = "compose"
files = ["compose.yaml"]

# Changes a project makes as it moves past a template version: moved and removed seed files, and renamed variables. Requires a PEP 440 version.

[[migrations]]
version = "1.0.0"
rename = [{from = "src/<% PACKAGE_NAME %>/settings.py",to = "src/<% PACKAGE_NAME %>/config.py"}]
remove = ["setup.cfg"]
rename_variables = [{from = "ORG",to = "ORGANIZATION"}]

# --- Tiers ---
# The workbench and production tiers: each a table of tool flags laid over the root flags. Declare both or neither, with tier naming the default.

[tiers.workbench]
mypy = false
pytest = false

[tiers.production]
mypy = true
pytest = true

# --- Custom Variables ---
# Optional descriptions shown when asking for a custom variable's value.

[variables.REGION]
description = "Deployment region, e.g. eu-west-1"

[variables.ORGANIZATION]
description = "The team that maintains the project"
