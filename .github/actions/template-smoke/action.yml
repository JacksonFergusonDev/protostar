name: "Template hooks smoke"
description: "Scaffolds each built-in template named and checks that its first commit passes the prek hooks Protostar installed"
inputs:
  templates:
    description: Space-separated built-in templates to scaffold, one after another
    required: true
  python:
    description: Python version each scaffold targets
    required: true
  retry:
    description: Retry a failed template once, passing when the retry passes
    required: false
    default: "false"
  wheel:
    description: Install Protostar from dist/*.whl instead of the checkout
    required: false
    default: "false"
  artifact:
    description: Names this job's artifact, source-builds-<artifact>, listing the packages each scaffold built from source, which the nightly report reads
    required: true
runs:
  using: "composite"
  steps:
    - name: Install Protostar
      shell: bash
      env:
        WHEEL: ${{ inputs.wheel }}
      run: |
        if [ "$WHEEL" = true ]; then
          uv tool install dist/*.whl
        else
          uv tool install --editable .
        fi
        uv tool install prek

    - name: Configure Git identity
      shell: bash
      run: |
        git config --global user.name "Protostar Bot"
        git config --global user.email "bot@protostar.dev"
        git config --global init.defaultBranch main
        git config --global core.autocrlf false
        git config --global credential.helper ""

    # Building prek's hook environments takes most of a smoke job: gitleaks and
    # actionlint compile with Go. Pull requests and main restore the newest that
    # main saved for the platform; Nightly and a release build them as a user's
    # first commit does, so that path is still tested every night.
    - name: Restore prek hook environments
      id: prek-restore
      if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/prek/repos
          ${{ runner.temp }}/prek/hooks
        key: prek-v1-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python }}-
        restore-keys: |
          prek-v1-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python }}-
          prek-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Verify each first commit triggers prek hooks
      id: smoke
      shell: bash
      env:
        PREK_HOME: ${{ runner.temp }}/prek
        GIT_TERMINAL_PROMPT: "0"
        GCM_INTERACTIVE: "never"
        PREK_COLOR: "never"
        TEMPLATES: ${{ inputs.templates }}
        PYTHON: ${{ inputs.python }}
        RETRY: ${{ inputs.retry }}
      run: |
        source_builds="$RUNNER_TEMP/source-builds"
        if command -v cygpath >/dev/null 2>&1; then
          source_builds=$(cygpath -u "$source_builds")
        fi
        rm -rf "$source_builds"
        mkdir -p "$source_builds"
        export SOURCE_BUILDS="$source_builds/builds.jsonl"
        # Every template runs even after one fails, so a run names all that broke.
        failed=()
        for template in $TEMPLATES; do
          smoke=("$GITHUB_WORKSPACE/.github/scripts/template-hooks-smoke.sh" "$template" "$PYTHON")
          echo "::group::$template"
          if "${smoke[@]}"; then
            echo "::endgroup::"
            continue
          fi
          echo "::endgroup::"
          if [ "$RETRY" = true ]; then
            # Downloads from PyPI and GitHub fail now and then; a real break fails twice.
            echo "::warning title=Smoke test retried::$template failed once and was retried; see the first attempt's output above"
            if "${smoke[@]}"; then
              continue
            fi
          fi
          failed+=("$template")
        done
        if [ ${#failed[@]} -gt 0 ]; then
          echo "::error title=Smoke test failed::${failed[*]} on Python $PYTHON"
          exit 1
        fi

    # Only main saves, after every scaffold passed, keeping just the hook
    # versions this run's scaffolds pinned.
    - name: Prune prek hook environments
      id: prek-prune
      if: steps.smoke.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        PREK_HOME: ${{ runner.temp }}/prek
      run: |
        temp_base="$RUNNER_TEMP"
        if command -v cygpath >/dev/null 2>&1; then
          temp_base=$(cygpath -u "$temp_base")
        fi
        digest=$(uv run --no-project python -m scripts.prek_cache "$PREK_HOME" "$temp_base"/smoke_*/.pre-commit-config.yaml)
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - name: Save prek hook environments
      if: steps.prek-prune.outcome == 'success' && steps.prek-restore.outputs.cache-matched-key != format('prek-v1-{0}-{1}-py{2}-{3}', runner.os, runner.arch, inputs.python, steps.prek-prune.outputs.digest)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/prek/repos
          ${{ runner.temp }}/prek/hooks
        key: prek-v1-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python }}-${{ steps.prek-prune.outputs.digest }}

    # After a failed smoke test too: what it built still slows init down.
    - name: Upload source builds
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: source-builds-${{ inputs.artifact }}
        path: ${{ runner.temp }}/source-builds/builds.jsonl
        if-no-files-found: ignore
        overwrite: true
        retention-days: 30
