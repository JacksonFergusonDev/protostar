name: "Run pytest"
description: "Runs pytest in parallel and uploads each attempt's per-test results for the nightly report; with retry, a test that fails and then passes alone is flaky and doesn't fail the job"
inputs:
  workers:
    description: "Number of pytest workers (auto uses every available CPU)"
    required: false
    default: "auto"
  args:
    description: "Extra pytest arguments, separated by spaces"
    required: false
    default: ""
  retry:
    description: "Retry failed tests once, passing the job when the retry passes"
    required: false
    default: "false"
  artifact:
    description: "Names this job's evidence artifact, test-results-<artifact>, which the nightly report reads"
    required: true
runs:
  using: "composite"
  steps:
    - name: Run tests
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        RETRY: ${{ inputs.retry }}
        WORKERS: ${{ inputs.workers }}
        FLAKY_LIST: flaky-tests.txt
        PROTOSTAR_TEST_RESULTS: test-results/first.json
      run: |
        read -ra extra <<< "$ARGS"
        rm -rf test-results
        pytest=(uv run pytest -p scripts.pytest_results -n "$WORKERS" --dist worksteal --durations=25 "${extra[@]}")
        if "${pytest[@]}"; then
          exit 0
        fi
        if [ "$RETRY" != true ]; then
          exit 1
        fi

        # A test that fails and then passes alone is flaky, not broken: list it
        # in the job summary instead of failing the run.
        uv run --no-sync python -c 'import json; print("\n".join(sorted(json.load(open(".pytest_cache/v/cache/lastfailed")))))' > "$FLAKY_LIST"
        echo "Retrying $(wc -l < "$FLAKY_LIST") failed test(s) once"
        retry_status=0
        export PROTOSTAR_TEST_RESULTS=test-results/retry.json
        "${pytest[@]}" --last-failed --last-failed-no-failures none || retry_status=$?
        # The retry can still fail. Only tests removed from lastfailed passed;
        # don't label persistent failures as flaky or claim the run passed.
        uv run --no-sync python -c 'import json, os; from pathlib import Path; p = Path(os.environ["FLAKY_LIST"]); failed = json.load(open(".pytest_cache/v/cache/lastfailed")); passed = sorted(set(p.read_text().splitlines()) - failed.keys()); p.write_text("".join(t + "\n" for t in passed))'
        if [ ! -s "$FLAKY_LIST" ]; then
          exit "$retry_status"
        fi
        {
          echo "### Flaky tests"
          echo
          echo "These failed, then passed when retried:"
          echo
          # shellcheck disable=SC2016 # the backticks are Markdown
          sed 's/^/- `/; s/$/`/' "$FLAKY_LIST"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::warning title=Flaky tests::$(wc -l < "$FLAKY_LIST") test(s) passed only when retried; see the job summary"
        exit "$retry_status"

    - name: Upload test evidence
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ inputs.artifact }}
        path: test-results/*.json
        if-no-files-found: ignore
        overwrite: true
        retention-days: 30
