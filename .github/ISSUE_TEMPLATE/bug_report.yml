name: Bug Report
description: Report a bug or unexpected behavior in Protostar.
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for reporting an issue.** Please run `protostar --version` to help narrow down the environment state.
  - type: input
    id: version
    attributes:
      label: Protostar Version
      description: What version of Protostar are you running? (Run `protostar --version` to find out)
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python is executing Protostar?
      placeholder: "e.g., 3.12.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface Mode
      options:
        - CLI Flags (non-interactive)
        - Interactive TUI (Recipe Editor / Review / Conflict Screen)
        - Headless / Machine Mode (--json)
    validations:
      required: false
  - type: input
    id: command
    attributes:
      label: Command Executed
      description: What exact command did you run?
      placeholder: "protostar init -t cli --ruff --mypy"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Traceback
      description: What actually happened? Paste any error output or tracebacks here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: pyproject
    attributes:
      label: pyproject.toml / Recipe (Optional)
      description: If this relates to sync, templates, or configuration, paste relevant sections from pyproject.toml.
      render: toml
    validations:
      required: false
