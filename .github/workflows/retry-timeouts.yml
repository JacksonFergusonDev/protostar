name: Retry Timed Out CI

# A job that hits its timeout-minutes is usually a hung runner, not a broken
# change, so it gets up to two fresh attempts. Only GitHub's own timeout
# annotation counts: a real failure, or a run a newer push cancelled, is left
# alone however long it ran.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: {}

jobs:
  retry-timed-out-jobs:
    name: Retry Timed Out Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.run_attempt < 3
    permissions:
      actions: write
      checks: read
    steps:
      - name: Check for timed-out jobs and retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.full_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # A job's id is its check run's id, which carries its annotations.
          unfinished=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "\(.id)\t\(.name)"')
          timed_out=()
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if gh api --paginate "repos/$REPO/check-runs/$id/annotations" --jq '.[].message' \
              | grep -q "exceeded the maximum execution time"; then
              timed_out+=("$name")
            fi
          done <<< "$unfinished"

          if [ ${#timed_out[@]} -eq 0 ]; then
            echo "No job hit its timeout; leaving the run as it is."
            exit 0
          fi
          printf 'Timed out: %s\n' "${timed_out[@]}"
          gh run rerun "$RUN_ID" --repo "$REPO" --failed
