name: Platforms

# The pytest suite and the template hooks smoke test on each platform the caller
# names. CI runs the combinations most likely to break on every pull request;
# Nightly runs the rest. Together they cover every OS, Python, and template.
on:
  workflow_call:
    inputs:
      tests:
        description: 'JSON list of {"os", "python"} pairs, with "coverage": true on at most one'
        required: true
        type: string
      smoke:
        description: 'JSON list of {"os", "template"} pairs'
        required: true
        type: string
      retry-failed-tests:
        description: Rerun failed tests once and pass the job when they pass, recording them as flaky
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.retry-failed-tests && 10 || 6 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tests) }}

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python }}

    - name: Install dependencies
      run: |
        uv sync --only-group ci --locked
        uv pip install pytest-github-actions-annotate-failures

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Run tests with coverage # (for Codecov)
      if: matrix.coverage
      run: uv run pytest -n auto --dist worksteal --durations=25 -o faulthandler_timeout=90 --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

    - name: Run tests # (without coverage to avoid overhead on non-Codecov runs)
      if: ${{ !matrix.coverage }}
      shell: bash
      env:
        RETRY: ${{ inputs.retry-failed-tests }}
        FLAKY_LIST: flaky-tests.txt
      run: |
        pytest=(uv run pytest -n auto --dist worksteal --durations=25 -o faulthandler_timeout=90)
        if "${pytest[@]}"; then
          exit 0
        fi
        if [ "$RETRY" != true ]; then
          exit 1
        fi

        # A test that fails and then passes alone is flaky, not broken: record
        # it for the nightly report instead of failing the run.
        uv run --no-sync python -c 'import json; print("\n".join(sorted(json.load(open(".pytest_cache/v/cache/lastfailed")))))' > "$FLAKY_LIST"
        echo "Retrying $(wc -l < "$FLAKY_LIST") failed test(s) once"
        "${pytest[@]}" --last-failed --last-failed-no-failures none
        {
          echo "### Flaky tests"
          echo
          echo "These failed, then passed when retried:"
          echo
          # shellcheck disable=SC2016 # the backticks are Markdown
          sed 's/^/- `/; s/$/`/' "$FLAKY_LIST"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "::warning title=Flaky tests::$(wc -l < "$FLAKY_LIST") test(s) passed only when retried; see the job summary"

    - name: Upload flaky tests
      if: ${{ hashFiles('flaky-tests.txt') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: flaky-tests-${{ matrix.os }}-py${{ matrix.python }}
        path: flaky-tests.txt
        retention-days: 30

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        name: coverage-ubuntu-py314
        fail_ci_if_error: true

    - name: Upload test analytics to Codecov
      if: ${{ matrix.coverage && !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit.xml
        disable_search: true
        report_type: test_results
        name: test-results-ubuntu-py314

  template-hooks-smoke:
    name: Template Hooks Smoke (${{ matrix.os }} / ${{ matrix.template }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.smoke) }}

    env:
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: "never"
      PREK_COLOR: "never"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install Protostar
      run: |
        uv tool install --editable .
        uv tool install prek

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Configure Git Identity
      shell: bash
      run: |
        git config --global user.name "Protostar Bot"
        git config --global user.email "bot@protostar.dev"
        git config --global init.defaultBranch main
        git config --global core.autocrlf false
        git config --global credential.helper ""

    - name: Verify first commit triggers prek hooks
      shell: bash
      run: |
        if command -v cygpath >/dev/null 2>&1; then
          TEMP_BASE=$(cygpath -u "${{ runner.temp }}")
        else
          TEMP_BASE="${{ runner.temp }}"
        fi
        SMOKE_DIR="$TEMP_BASE/smoke_${{ matrix.template }}"
        rm -rf "$SMOKE_DIR"
        mkdir -p "$SMOKE_DIR"
        cd "$SMOKE_DIR"

        protostar init --template ${{ matrix.template }} --prek --python-version 3.12

        # 1. Verify pre-commit hook script was installed by Protostar
        test -f .git/hooks/pre-commit || { echo "ERROR: .git/hooks/pre-commit missing"; exit 1; }

        # Pre-stage all files so hooks have staged content to inspect
        git add .

        # 2. Canary test: verify commit-msg hook actively rejects non-conventional commit (when present)
        if [ -f .git/hooks/commit-msg ]; then
          echo "=== Running commit-msg hook canary test ==="
          canary_code=0
          canary_output=$(git commit -m "invalid non-conventional commit message" < /dev/null 2>&1) || canary_code=$?
          if [ $canary_code -eq 0 ]; then
            echo "ERROR: commit-msg hook failed to reject invalid commit message"
            echo "$canary_output"
            exit 1
          else
            echo "Canary commit correctly rejected by commit-msg hook (exit code $canary_code)"
            echo "$canary_output"
          fi
        fi

        # 3. Verify clean first commit triggers prek hooks and succeeds
        echo "=== Running valid initial commit ==="
        commit_code=0
        commit_output=$(git commit -m "feat: initial scaffold" < /dev/null 2>&1) || commit_code=$?
        echo "$commit_output"

        if [ $commit_code -ne 0 ]; then
          echo "ERROR: Initial commit failed with exit code $commit_code"
          exit 1
        fi

        # 4. Verify hook execution output is present in commit output
        echo "$commit_output" | grep -qE "(uv lock check|ruff check|ruff format|Passed)" || {
          echo "ERROR: Prek hook execution not detected in commit output"
          exit 1
        }
