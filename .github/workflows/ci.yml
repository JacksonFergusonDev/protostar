name: CI

on:
  push:
    branches: [ "main", "renovate/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --only-group ci --locked

    - name: Run Ruff Linter
      run: uv run ruff check --output-format=github .

    - name: Run Ruff Formatter
      run: uv run ruff format --check --output-format=github .

    - name: Lint Markdown with rumdl
      run: uv run rumdl check --output-format github .

    - name: Check Markdown formatting with rumdl
      run: uv run rumdl fmt --check --output-format github .

    - name: Run actionlint
      run: uv run actionlint .github/workflows/*.yml

    - name: Type check with Mypy
      run: uv run mypy .

  docs:
    name: Documentation Checks & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --group ci --group docs --locked

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Verify snapshots and documentation assets are up-to-date
      run: uv run python scripts/run_snapshots.py

    - name: Validate embedded documentation links
      run: uv run python scripts/check_doc_links.py

    - name: Check documentation against the code
      run: uv run python scripts/check_docs_drift.py

    - name: Check docs/house matches its house-style release
      run: uv run python scripts/sync_house_style.py --check

    - name: Build documentation (strict)
      run: uv run zensical build --strict

    - name: Validate schemas
      run: uv run python scripts/check_schemas.py

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Every OS at the oldest and newest Python, and every template on Linux plus
  # cli on Windows. Nightly runs every combination. Two macOS jobs at most,
  # since the account runs five at a time and a third would wait for a runner.
  platforms:
    name: Platforms
    uses: ./.github/workflows/platforms.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.14"],
          "include": [
            {"os": "ubuntu-latest", "python": "3.13"},
            {"os": "ubuntu-latest", "python": "3.14", "coverage": true}
          ]
        }
      smoke: >-
        {
          "os": ["ubuntu-latest"],
          "python": ["3.12"],
          "template": ["cli", "api", "lib", "astro", "ml"],
          "include": [
            {"os": "windows-latest", "python": "3.12", "template": "cli"}
          ]
        }

  template-docker-build:
    name: Template Docker Build (${{ matrix.template }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        template: [cli, api]

    env:
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: "never"
      IMAGE: protostar-smoke-${{ matrix.template }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install Protostar
      run: uv tool install --editable .

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Configure Git Identity
      run: |
        git config --global user.name "Protostar Bot"
        git config --global user.email "bot@protostar.dev"
        git config --global init.defaultBranch main

    - name: Scaffold ${{ matrix.template }} with a Dockerfile
      run: |
        mkdir "$RUNNER_TEMP/docker_${{ matrix.template }}"
        cd "$RUNNER_TEMP/docker_${{ matrix.template }}"
        protostar init --template ${{ matrix.template }} --docker --no-prek --python-version 3.12
        test -f Dockerfile
        test -f .dockerignore
        test -f uv.lock

    - name: Build image
      working-directory: ${{ runner.temp }}/docker_${{ matrix.template }}
      run: docker build --tag "$IMAGE" .

    - name: Smoke test cli image
      if: matrix.template == 'cli'
      run: docker run --rm "$IMAGE" --help

    - name: Smoke test api image
      if: matrix.template == 'api'
      run: |
        docker run --detach --name "$IMAGE" --publish 8000:8000 "$IMAGE"
        for _ in $(seq 1 30); do
          if curl --fail --silent --show-error http://localhost:8000/health; then
            echo
            exit 0
          fi
          sleep 1
        done
        echo "ERROR: api container never answered /health"
        docker logs "$IMAGE"
        exit 1

  benchmark-gate:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Test benchmark dashboard data handling
      run: node --test tests/benchmark_metrics.test.mjs

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install hyperfine
      uses: taiki-e/install-action@d8055f5aa4515e0781b947765fa3d1559d2d3f45 # hyperfine

    - name: Install dependencies
      run: uv sync --no-dev --locked

    - name: Run benchmarks
      run: |
        hyperfine --warmup 5 --runs 30 --export-json benchmark.json \
          '.venv/bin/protostar help init' \
          'PROTOSTAR_BENCHMARK_RECIPE_EDITOR=1 .venv/bin/protostar init'

    - name: Convert hyperfine output for benchmark action
      run: uv run python scripts/parse_benchmarks.py --input benchmark.json --output benchmark-gh.json

    - name: Evaluate regression threshold
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Protostar Initialization Latency
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-gh.json
        gh-pages-branch: 'gh-pages'
        benchmark-data-dir-path: 'benchmarks'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
        alert-threshold: '250%'
        comment-on-alert: true
        auto-push: false
