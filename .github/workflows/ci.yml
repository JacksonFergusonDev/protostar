name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    # Stacked PRs need the same checks before their parent merges.

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; every push to a
# branch keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A run starts 20 jobs, the account's limit, three of them on macOS, which runs
# five at a time. The quick checks share two runners: each finishes well before
# the Windows suite, which sets how long a run takes. tests/test_nightly.py
# holds both limits.
jobs:
  checks:
    name: Lint, Docs & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      # Gitleaks lists a pull request's commits to scan only those.
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.24"
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      id: setup
      run: uv sync --group ci --group docs --locked

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    # Each check runs after another fails, so a run reports every one that broke.
    - name: Run Gitleaks
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Ruff Linter
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run ruff check --output-format=github .

    - name: Run Ruff Formatter
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run ruff format --check --output-format=github .

    - name: Lint Markdown with rumdl
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run rumdl check --output-format github .

    - name: Check Markdown formatting with rumdl
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run rumdl fmt --check --output-format github .

    - name: Run actionlint
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run actionlint .github/workflows/*.yml

    - name: Audit workflow security with zizmor
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run zizmor --offline --config .github/zizmor.yml --format github .github/

    - name: Type check with Mypy
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run mypy .

    - name: Verify snapshots and documentation assets are up-to-date
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run python -m scripts.run_snapshots

    - name: Validate embedded documentation links
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run python -m scripts.check_doc_links

    - name: Check documentation against the code
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run python -m scripts.check_docs_drift

    - name: Check docs/house matches its house-style release
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run just sync-house-style --check

    - name: Build documentation (strict)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run zensical build --strict

    - name: Validate schemas
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv run --locked python -m scripts.check_schemas

  # Every OS and Python runs the suite; macOS smoke-tests templates after it,
  # so it takes no runner of its own. Linux smoke-tests every template at every
  # Python, and Windows every template at the oldest and newest. The Linux jobs
  # split every rollback fault between them, with commands faked. Nightly runs
  # the rest.
  platforms:
    name: Platforms
    uses: ./.github/workflows/platforms.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "include": [
            {"os": "ubuntu-latest", "python": "3.12", "rollback": "1/3"},
            {"os": "ubuntu-latest", "python": "3.13", "rollback": "2/3"},
            {"os": "ubuntu-latest", "python": "3.14", "coverage": true, "rollback": "3/3"},
            {"os": "macos-latest", "python": "3.12", "smoke": ["ml"]},
            {"os": "macos-latest", "python": "3.13", "smoke": ["api", "astro"]},
            {"os": "macos-latest", "python": "3.14", "smoke": ["cli", "lib"]}
          ]
        }
      smoke: >-
        {
          "os": ["ubuntu-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "templates": [["api", "astro", "cli", "lib", "ml"]],
          "include": [
            {"os": "windows-latest", "python": "3.12", "templates": ["cli", "astro"]},
            {"os": "windows-latest", "python": "3.12", "templates": ["api", "lib"]},
            {"os": "windows-latest", "python": "3.12", "templates": ["ml"]},
            {"os": "windows-latest", "python": "3.14", "templates": ["cli", "astro"]},
            {"os": "windows-latest", "python": "3.14", "templates": ["api", "lib"]},
            {"os": "windows-latest", "python": "3.14", "templates": ["ml"]}
          ]
        }

  # The metrics dashboard's data handling, then the cli and api images. Timing
  # never gates a pull request: benchmark.yml measures it nightly.
  images-and-dashboard:
    name: Docker Images & Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PYTHONIOENCODING: "utf-8"
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: "never"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Test metrics dashboard data handling
      run: node --test tests/metrics_dashboard.test.mjs

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.24"
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      id: setup
      run: uv sync --no-dev --locked

    - name: Install Protostar
      id: protostar
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: uv tool install --editable .

    - name: Mock direnv
      if: ${{ !cancelled() && steps.protostar.outcome == 'success' }}
      uses: ./.github/actions/mock-direnv

    - name: Configure Git Identity
      if: ${{ !cancelled() && steps.protostar.outcome == 'success' }}
      run: |
        git config --global user.name "Protostar Bot"
        git config --global user.email "bot@protostar.dev"
        git config --global init.defaultBranch main

    - name: Build and run the cli image
      if: ${{ !cancelled() && steps.protostar.outcome == 'success' }}
      env:
        UV_PYTHON: "3.12"
      run: |
        mkdir "$RUNNER_TEMP/docker_cli"
        cd "$RUNNER_TEMP/docker_cli"
        protostar init --template cli --docker --no-prek --python-version 3.12
        test -f Dockerfile
        test -f .dockerignore
        test -f uv.lock
        docker build --tag protostar-smoke-cli .
        docker run --rm protostar-smoke-cli --help

    - name: Build and run the api image
      if: ${{ !cancelled() && steps.protostar.outcome == 'success' }}
      env:
        UV_PYTHON: "3.12"
      run: |
        mkdir "$RUNNER_TEMP/docker_api"
        cd "$RUNNER_TEMP/docker_api"
        protostar init --template api --docker --no-prek --python-version 3.12
        test -f Dockerfile
        test -f .dockerignore
        test -f uv.lock
        docker build --tag protostar-smoke-api .
        docker run --detach --name protostar-smoke-api --publish 8000:8000 protostar-smoke-api
        for _ in $(seq 1 30); do
          if curl --fail --silent --show-error http://localhost:8000/health; then
            echo
            exit 0
          fi
          sleep 1
        done
        echo "ERROR: api container never answered /health"
        docker logs protostar-smoke-api
        exit 1

  # The one check the main ruleset requires, so a renamed or added matrix entry
  # can't leave a pull request waiting on a check that never reports. It starts
  # only after the others finish, so it never adds to the runners in use.
  ci-passed:
    name: CI passed
    needs: [checks, platforms, images-and-dashboard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
    - name: Require every job to pass
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$RESULTS")
        if [ -n "$failed" ]; then
          echo "::error title=CI failed::$(paste -sd ';' <<< "$failed")"
          exit 1
        fi
