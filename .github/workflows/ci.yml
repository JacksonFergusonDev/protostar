name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --only-group ci --locked

    - name: Run Ruff Linter
      run: uv run ruff check --output-format=github .

    - name: Run Ruff Formatter
      run: uv run ruff format --check --output-format=github .

    - name: Lint Markdown with rumdl
      run: uv run rumdl check --output-format github .

    - name: Check Markdown formatting with rumdl
      run: uv run rumdl fmt --check --output-format github .

    - name: Run actionlint
      run: uv run actionlint .github/workflows/*.yml

    - name: Type check with Mypy
      run: uv run mypy .

  docs:
    name: Documentation Checks & Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --only-group ci --locked

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Verify snapshots and documentation assets are up-to-date
      run: uv run python scripts/run_snapshots.py

    - name: Validate embedded documentation links
      run: uv run python scripts/check_doc_links.py

    - name: Validate schemas
      run: uv run python scripts/check_schemas.py

  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --only-group ci --locked
        uv pip install pytest-github-actions-annotate-failures

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Run tests with coverage # (for Codecov)
      if: matrix.coverage
      run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

    - name: Run tests # (without coverage to avoid overhead on non-Codecov runs)
      if: ${{ !matrix.coverage }}
      shell: bash
      run: uv run pytest

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        name: coverage-ubuntu-py314
        fail_ci_if_error: true

    - name: Upload test analytics to Codecov
      if: ${{ matrix.coverage && !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit.xml
        disable_search: true
        report_type: test_results
        name: test-results-ubuntu-py314

  template-hooks-smoke:
    name: Template Hooks Smoke (${{ matrix.os }} / ${{ matrix.template }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            template: cli
          - os: ubuntu-latest
            template: api
          - os: ubuntu-latest
            template: astro
          - os: ubuntu-latest
            template: dsp
          - os: ubuntu-latest
            template: embedded
          - os: ubuntu-latest
            template: ml
          - os: macos-latest
            template: cli
          - os: macos-latest
            template: api
          - os: windows-latest
            template: cli
          - os: windows-latest
            template: api

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install Protostar
      run: uv tool install --editable .

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Configure Git Identity
      shell: bash
      run: |
        git config --global user.name "Protostar Bot"
        git config --global user.email "bot@protostar.dev"
        git config --global init.defaultBranch main

    - name: Verify first commit triggers prek hooks
      shell: bash
      run: |
        SMOKE_DIR="${{ runner.temp }}/smoke_${{ matrix.template }}"
        rm -rf "$SMOKE_DIR"
        mkdir -p "$SMOKE_DIR"
        cd "$SMOKE_DIR"

        protostar init --template ${{ matrix.template }} --prek --python-version 3.12

        # 1. Verify pre-commit hook script was installed by Protostar
        test -f .git/hooks/pre-commit || { echo "ERROR: .git/hooks/pre-commit missing"; exit 1; }

        # 2. Canary test: verify commit-msg hook actively rejects non-conventional commit (when present)
        git add .
        if [ -f .git/hooks/commit-msg ]; then
          if git commit -m "invalid non-conventional commit message" 2>/dev/null; then
            echo "ERROR: commit-msg hook failed to reject invalid commit message"
            exit 1
          fi
        fi

        # 3. Verify clean first commit triggers prek hooks and succeeds
        commit_output=$(git commit -m "feat: initial scaffold" 2>&1)
        commit_code=$?
        echo "$commit_output"

        if [ $commit_code -ne 0 ]; then
          echo "ERROR: Initial commit failed with exit code $commit_code"
          exit 1
        fi

        # 4. Verify hook execution output is present in commit output
        echo "$commit_output" | grep -qE "(uv lock check|ruff check|ruff format|Passed)" || {
          echo "ERROR: Prek hook execution not detected in commit output"
          exit 1
        }

  benchmark-gate:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install hyperfine
      uses: taiki-e/install-action@d8055f5aa4515e0781b947765fa3d1559d2d3f45 # hyperfine

    - name: Install dependencies
      run: uv sync --no-dev --locked

    - name: Run benchmarks
      run: |
        hyperfine --warmup 5 --runs 30 --export-json benchmark.json \
          '.venv/bin/protostar help init' \
          'PROTOSTAR_BENCHMARK_WIZARD=1 .venv/bin/protostar init'

    - name: Convert hyperfine output for benchmark action
      run: uv run python scripts/parse_benchmarks.py --input benchmark.json --output benchmark-gh.json --gate-mode

    - name: Evaluate regression threshold
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Protostar Initialization Latency
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-gh.json
        gh-pages-branch: 'performance-benchmarks'
        benchmark-data-dir-path: './'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
        alert-threshold: '150%'
        comment-on-alert: true
        auto-push: false
