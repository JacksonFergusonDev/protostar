name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --only-group ci --locked
        uv pip install pytest-github-actions-annotate-failures

    - name: Mock direnv
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        cat > "$RUNNER_TEMP/bin/direnv" <<'EOF'
        #!/bin/sh
        # direnv is not required in CI; Protostar only invokes `direnv allow`.
        exit 0
        EOF
        cat > "$RUNNER_TEMP/bin/direnv.cmd" <<'EOF'
        @echo off
        exit /b 0
        EOF
        chmod +x "$RUNNER_TEMP/bin/direnv"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Run Ruff Linter
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: uv run ruff check --output-format=github .

    - name: Run Ruff Formatter
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: uv run ruff format --check --output-format=github .

    - name: Lint Markdown
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24
      with:
        globs: '**/*.md'

    - name: Type check with Mypy
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: uv run mypy .

    - name: Run tests with coverage # (for Codecov)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

    - name: Run tests # (without coverage to avoid overhead on non-Codecov runs)
      if: matrix.os != 'windows-latest' && !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14')
      run: uv run pytest

    - name: Run tests (Windows) # (skip slow tests, but run one E2E smoke test)
      if: matrix.os == 'windows-latest'
      run: |
        uv run pytest -m "not (integration or exhaustive)"
        uv run pytest "tests/test_exhaustive.py::test_individual_template_scaffolding[cli]"

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        name: coverage-ubuntu-py314
        fail_ci_if_error: true

    - name: Upload test analytics to Codecov
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: junit.xml
        disable_search: true
        report_type: test_results
        name: test-results-ubuntu-py314

    - name: Verify documentation fixtures are up-to-date
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
      run: |
        uv run python scripts/generate_doc_fixtures.py
        git diff --exit-code docs/fixtures/ || (echo "::error::Docs are out of date! Run 'uv run python scripts/generate_doc_fixtures.py' locally and commit the changes." && exit 1)

    - name: Validate embedded documentation links
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
      run: uv run python scripts/check_doc_links.py

  benchmark-gate:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install hyperfine
      uses: taiki-e/install-action@d8055f5aa4515e0781b947765fa3d1559d2d3f45 # hyperfine

    - name: Install dependencies
      run: uv sync --no-dev --locked

    - name: Run benchmarks
      run: |
        hyperfine --warmup 5 --runs 30 --export-json benchmark.json \
          '.venv/bin/protostar help init' \
          'PROTOSTAR_BENCHMARK_WIZARD=1 .venv/bin/protostar init'

    - name: Convert hyperfine output for benchmark action
      run: uv run python scripts/parse_benchmarks.py --input benchmark.json --output benchmark-gh.json --gate-mode

    - name: Evaluate regression threshold
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Protostar Initialization Latency
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-gh.json
        gh-pages-branch: 'performance-benchmarks'
        benchmark-data-dir-path: './'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
        alert-threshold: '150%'
        comment-on-alert: true
        auto-push: false
