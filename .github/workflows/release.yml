name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Verify registry fallbacks
        run: python scripts/sync_registry_fallbacks.py --check

      - name: Verify secret-detection rules
        run: python scripts/sync_secret_rules.py --check

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  sync-homebrew:
    name: Delegate Homebrew Update
    needs: build-n-publish
    uses: JacksonFergusonDev/ci-cd-release-infrastructure/.github/workflows/update-homebrew.yml@cff447baf1076b8807502ab8da7d2f0867a973fc # main
    with:
      tag: ${{ github.ref_name }}
      package_name: "protostar"
      formula_path: "Formula/protostar.rb"
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: build-n-publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install docs dependencies
        run: uv sync --only-group docs --locked

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build versioned documentation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike deploy \
            --update-aliases \
            --alias-type redirect \
            "$VERSION" latest
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike set-default latest

      - name: Push versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin gh-pages

      - name: Prepare Pages artifact
        run: |
          git worktree add published gh-pages
          root_version="$(uv run --group docs python -c 'import json; versions = json.load(open("published/versions.json")); print(next((item["version"] for item in versions if "latest" in item["aliases"]), "latest"))')"
          cp -a "published/$root_version/." published/
          python -c "import tomlkit, yaml, json; p = tomlkit.load(open('zensical.toml'))['project']; yaml.dump({'site_name': str(p['site_name']), 'site_description': str(p['site_description']), 'site_url': str(p['site_url']), 'nav': json.loads(json.dumps(p['nav']))}, open('mkdocs.yml', 'w'))"
          uv run --group docs llmstxt-standalone build --site-dir published --output-dir published
          rm -f mkdocs.yml
          echo "protostar.jacksonferguson.me" > published/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: ./published

  deploy-docs:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build-docs
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
