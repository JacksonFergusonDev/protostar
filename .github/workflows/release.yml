name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy documentation for (updates latest)
        required: true
        type: string

jobs:
  build-n-publish:
    if: github.event_name == 'push'
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Verify registry fallbacks
        run: python scripts/sync_registry_fallbacks.py --check

      - name: Verify secret-detection rules
        run: python scripts/sync_secret_rules.py --check

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  sync-homebrew:
    name: Delegate Homebrew Update
    needs: build-n-publish
    uses: JacksonFergusonDev/ci-cd-release-infrastructure/.github/workflows/update-homebrew.yml@13d5049ccbe6d72405ea86c93892f06ef2942d8f # main
    with:
      tag: ${{ github.ref_name }}
      package_name: "protostar"
      formula_path: "Formula/protostar.rb"
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: build-n-publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build-n-publish.result == 'success') }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing release tag such as v0.10.0" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || true

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install docs dependencies
        run: uv sync --only-group docs --locked

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build versioned documentation
        run: |
          VERSION="${RELEASE_TAG#v}"
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike deploy \
            --update-aliases \
            --alias-type redirect \
            "$VERSION" latest
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike set-default latest

      - name: Push versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin gh-pages

  publish-pages:
    name: Publish documentation and benchmarks
    needs: build-docs
    if: ${{ !cancelled() && needs.build-docs.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
