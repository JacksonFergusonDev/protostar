name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy documentation for (updates latest)
        required: true
        type: string

jobs:
  build:
    if: github.event_name == 'push'
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Verify registry fallbacks
        run: python -m scripts.sync_registry_fallbacks --check

      - name: Verify secret-detection rules
        run: python -m scripts.sync_secret_rules --check

      - name: Build distribution
        run: uv build

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Both checks may precede the version bump. Nightly may also precede one
  # generated-input refresh, using the same commit rules as local preparation.
  checks-passed:
    if: github.event_name == 'push'
    name: Check CI and Nightly passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3

      - name: Find passing CI and Nightly runs on eligible commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          candidates=$(python -m scripts.release_commits "$GITHUB_SHA" --tagged)
          missing=0
          for workflow in ci.yml nightly.yml; do
            mapfile -t workflow_candidates < <(jq -r --arg workflow "$workflow" '.[$workflow][]' <<< "$candidates")
            found=""
            for sha in "${workflow_candidates[@]}"; do
              passed=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$sha&status=success" --jq '.total_count' || echo 0)
              if [ "$passed" -gt 0 ]; then
                found=$sha
                break
              fi
            done
            if [ -n "$found" ]; then
              echo "$workflow passed on ${found::7}."
            else
              echo "::error title=$workflow has not passed::No passing $workflow run on ${workflow_candidates[*]}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "Wait for CI, or run Nightly on the tag, then rerun this workflow's failed jobs once it passes:"
              echo "  gh workflow run nightly.yml --ref $TAG"
              echo "  gh run rerun $GITHUB_RUN_ID --failed"
            } >&2
            exit 1
          fi

  smoke:
    if: github.event_name == 'push'
    name: Smoke
    needs: build
    uses: ./.github/workflows/platforms.yml
    with:
      wheel-artifact: dist
      smoke: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.14"],
          "templates": [["cli"]]
        }

  publish:
    if: github.event_name == 'push'
    name: Publish to PyPI
    needs: [build, checks-passed, smoke]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  sync-homebrew:
    name: Delegate Homebrew Update
    needs: publish
    uses: JacksonFergusonDev/ci-cd-release-infrastructure/.github/workflows/update-homebrew.yml@13d5049ccbe6d72405ea86c93892f06ef2942d8f # main
    with:
      tag: ${{ github.ref_name }}
      package_name: "protostar"
      formula_path: "Formula/protostar.rb"
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an existing release tag such as v0.10.0" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || true

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install docs dependencies
        run: uv sync --only-group docs --locked

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build versioned documentation
        run: |
          VERSION="${RELEASE_TAG#v}"
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike deploy \
            --update-aliases \
            --alias-type redirect \
            "$VERSION" latest
          uv run --with git+https://github.com/squidfunk/mike.git \
            mike set-default latest

      - name: Push versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin gh-pages

  publish-pages:
    name: Publish documentation and metrics
    needs: build-docs
    if: ${{ !cancelled() && needs.build-docs.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
