name: Publish GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

# Serialize the entire assembly and deployment, fetching current data only
# after acquiring this slot. An older artifact must never deploy afterward.
concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url || steps.deployment_4.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read current published versions and metrics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages-source
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install documentation dependencies
        run: uv sync --no-default-groups --group docs --locked

      - name: Assemble documentation, redirects, and metrics
        run: |
          latest_version="$(uv run --no-default-groups --group docs --locked python -m scripts.prepare_pages pages-source --print-latest)"
          git show "refs/tags/v${latest_version}:zensical.toml" > latest-zensical.toml
          uv run --no-default-groups --group docs --locked python -m scripts.prepare_pages pages-source \
            --output published --config latest-zensical.toml

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: metrics/package.json

      - name: Install metrics checking dependencies
        run: pnpm --dir metrics install --frozen-lockfile --ignore-scripts

      - name: Check metrics JavaScript types
        run: pnpm --dir metrics run typecheck

      - name: Test metrics dashboard data handling
        run: pnpm --dir metrics test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: published

      # GitHub's artifact listing can lag behind upload finalization by seconds
      # (actions/deploy-pages#451), and deploy-pages queries it once with no
      # retry. Retry the deploy step with backoff rather than re-running the
      # whole job, which would upload a second github-pages artifact and fail
      # on the duplicate name (actions/deploy-pages#338).
      - name: Deploy to GitHub Pages
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before retrying GitHub Pages deploy (attempt 2/4)
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 5

      - name: Deploy to GitHub Pages (attempt 2/4)
        id: deployment_2
        if: steps.deployment_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before retrying GitHub Pages deploy (attempt 3/4)
        if: steps.deployment_2.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 3/4)
        id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before retrying GitHub Pages deploy (attempt 4/4)
        if: steps.deployment_3.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 4/4)
        id: deployment_4
        if: steps.deployment_3.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
