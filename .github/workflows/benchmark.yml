name: Performance Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Execute & Evaluate
    # Condition: Run on main branch pushes, OR if the PR has the specific label
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-benchmark')

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: "3.14"

    - name: Install hyperfine
      uses: taiki-e/install-action@5c1067cb42c4cbaae13044ec9b28241535544abf # hyperfine

    - name: Install just
      uses: taiki-e/install-action@0334dda302527f8273dd5d46ea2b78b0fa074ee1 # just

    - name: Install dependencies
      run: uv sync --group ci

    - name: Run rigerous benchmarks
      run: just test-benchmark-slower

    - name: Convert hyperfine output for benchmark action
      run: |
        python << 'PY'
        import json

        with open("benchmark.json") as f:
            data = json.load(f)

        converted = []
        for result in data["results"]:
            mean_ms = result["mean"] * 1000

            # Map the raw command to a clean dashboard label
            if "WIZARD" in result["command"]:
                name = "Protostar TUI Wizard Latency"
            else:
                name = "Protostar Headless Latency"

            converted.append({
                "name": name,
                "unit": "ms",
                "value": round(mean_ms, 2)
            })

        with open("benchmark-gh.json", "w") as f:
            json.dump(converted, f, indent=2)
        PY

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Protostar Initialization Latency
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-gh.json
        gh-pages-branch: 'performance-benchmarks'
        benchmark-data-dir-path: './'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
        alert-threshold: '150%'
        comment-on-alert: true
        auto-push: ${{ github.event_name == 'push' }}
