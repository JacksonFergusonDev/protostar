name: Performance Benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Execute & Evaluate
    # Condition: Run on main branch pushes, OR if the PR has the specific label
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-benchmark')

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install hyperfine
      uses: taiki-e/install-action@d8055f5aa4515e0781b947765fa3d1559d2d3f45 # hyperfine

    - name: Install dependencies
      run: uv sync --no-dev --locked

    - name: Run benchmarks
      run: |
        hyperfine --warmup 30 --runs 90 --export-json benchmark.json \
          '.venv/bin/protostar help init' \
          'PROTOSTAR_BENCHMARK_WIZARD=1 .venv/bin/protostar init'

    - name: Convert hyperfine output for benchmark action
      run: uv run python scripts/parse_benchmarks.py --input benchmark.json --output benchmark-gh.json

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Protostar Initialization Latency
        tool: 'customSmallerIsBetter'
        output-file-path: benchmark-gh.json
        gh-pages-branch: 'performance-benchmarks'
        benchmark-data-dir-path: './'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
        alert-threshold: '150%'
        comment-on-alert: true
        auto-push: ${{ github.event_name == 'push' }}
