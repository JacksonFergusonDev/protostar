name: Nightly

# Once a day on main: the smoke tests pull requests leave out, so the two
# together scaffold every built-in template on every OS and Python, and the
# suite again with retries, which is how a flaky test is found. A release
# requires CI and Nightly to have passed on the commit it bumps. Nightly Report
# files the outcome as an issue. After its gate, the run starts 11 jobs, three
# of them on macOS.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Check for new commits
    # Only the schedule skips: a manual run always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
    - name: Compare with the last passing run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "main is still at ${GITHUB_SHA::7}, which already passed."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  platforms:
    name: Platforms
    needs: gate
    # A failed gate runs the checks anyway, so a broken gate can't hide a broken main.
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' }}
    uses: ./.github/workflows/platforms.yml
    with:
      retry: true
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "include": [
            {"os": "macos-latest", "python": "3.12", "smoke": ["api", "astro", "cli", "lib"]},
            {"os": "macos-latest", "python": "3.13", "smoke": ["cli", "lib", "ml"]},
            {"os": "macos-latest", "python": "3.14", "smoke": ["api", "astro", "ml"]}
          ]
        }
      smoke: >-
        {
          "os": ["windows-latest"],
          "python": ["3.13"],
          "templates": [["cli", "astro", "ml"], ["api", "lib"]]
        }
