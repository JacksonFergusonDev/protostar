name: Nightly

# Once a day on main: the smoke tests pull requests leave out, so the two
# together scaffold every built-in template on every OS and Python, and the
# suite again with retries, which is how a flaky test is found. It also fails
# init at every write and command of every template, with real commands, on
# every OS, and runs the suite under the newest and the oldest dependency
# versions a user can install. A release requires CI on the source it bumps;
# Nightly may precede a generated-input refresh. Nightly Report files the
# outcome as an issue. The run starts 58 jobs, eight of them on macOS: a
# scheduled run has no runner limit.
#
# cron-job.org dispatches it at 3am Pacific with scheduled=true, because
# GitHub starts scheduled runs hours late. The schedule below is the fallback
# when that call never arrives: the gate skips it after a dispatched run passed.
# The gate finds tonight's scheduled run by this name.
run-name: ${{ (github.event_name == 'schedule' || inputs.scheduled) && 'Nightly (scheduled)' || 'Nightly' }}
on:
  schedule:
    # 6:17am Pacific (5:17am in winter): it must fall after the 3am dispatch.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Run as the nightly schedule does: skip a commit that already passed."
        type: boolean
        default: false
      rollback-only:
        description: "Run only the rollback jobs, to reproduce a rollback failure."
        type: boolean
        default: false
      os:
        description: "Limit the rollback jobs to one operating system."
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, windows-latest]
      template:
        description: "Limit the rollback jobs to one template."
        type: choice
        default: all
        options: [all, api, astro, cli, lib, ml]

permissions:
  contents: read

jobs:
  gate:
    name: Check for new commits
    # Only the schedule skips: a manual run always runs.
    if: github.event_name == 'schedule' || inputs.scheduled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      issues: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      ran-tonight: ${{ steps.compare.outputs.ran-tonight }}

    steps:
    - name: Compare with the last passing run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
      run: |
        # The schedule is the fallback for cron-job.org's dispatch: once a
        # scheduled run has started tonight, it runs nothing, not even the
        # dependency runs, so no night counts twice.
        if [ "$EVENT" = schedule ]; then
          tonight=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --limit 20 --json databaseId,displayTitle,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .displayTitle == \"Nightly (scheduled)\" and now - (.createdAt | fromdateiso8601) < 20 * 3600)] | length")
          if [ "$tonight" != 0 ]; then
            echo "A scheduled run already started tonight."
            echo "ran-tonight=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        pending=$(gh issue list --repo "$REPO" --label awaiting-verification --state open --limit 1 --json number --jq length)
        # Three runs must verify a fix even when no further commits land.
        if [ "$last" = "$GITHUB_SHA" ] && [ "$pending" = 0 ]; then
          echo "main is still at ${GITHUB_SHA::7}, which already passed."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  select:
    name: Select rollback jobs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rollback: ${{ steps.matrix.outputs.rollback }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Build the rollback matrix
      id: matrix
      env:
        OS: ${{ inputs.os || 'all' }}
        TEMPLATE: ${{ inputs.template || 'all' }}
      run: echo "rollback=$(python3 -m scripts.nightly_matrix --os "$OS" --template "$TEMPLATE")" >> "$GITHUB_OUTPUT"

  # ARM Linux, which pull requests leave out, runs the suite once and scaffolds
  # every template at the oldest and newest Python. Protostar is pure Python and
  # macOS already runs on ARM, so what only this platform tests is the wheels a
  # scaffold installs: a package with no aarch64 Linux wheel builds from source.
  platforms:
    name: Platforms
    needs: gate
    # A failed gate runs the checks anyway, so a broken gate can't hide a broken main.
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' && !inputs.rollback-only }}
    uses: ./.github/workflows/platforms.yml
    with:
      retry: true
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "include": [
            {"os": "macos-latest", "python": "3.12", "smoke": ["api", "astro", "cli", "lib"]},
            {"os": "macos-latest", "python": "3.13", "smoke": ["cli", "lib", "ml"]},
            {"os": "macos-latest", "python": "3.14", "smoke": ["api", "astro", "ml"]},
            {"os": "ubuntu-24.04-arm", "python": "3.14", "smoke": ["api", "astro", "cli", "lib", "ml"]}
          ]
        }
      smoke: >-
        {
          "os": ["windows-latest"],
          "python": ["3.13"],
          "templates": [["cli", "astro", "ml"], ["api", "lib"]],
          "include": [
            {"os": "ubuntu-24.04-arm", "python": "3.12", "templates": ["api", "astro", "cli", "lib", "ml"]}
          ]
        }

  # The suite under the versions users can install rather than uv.lock's: pip,
  # pipx, and uv tool resolve Protostar's requirement ranges fresh. Latest is
  # what a fresh install gets today, past the week exclude-newer holds locks
  # to, so an upstream release that breaks Protostar shows up here first; it
  # runs even when main hasn't changed, since the releases have. Lowest holds
  # each direct dependency at its declared minimum, so a minimum can't promise
  # more than the code needs.
  dependency-bounds:
    name: Dependencies (${{ matrix.resolution }} / Python ${{ matrix.python }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.ran-tonight != 'true' && !inputs.rollback-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        resolution: [latest, lowest]
        python: ["3.12", "3.14"]

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
        python-version: ${{ matrix.python }}

    - name: Resolve the ${{ matrix.resolution }} versions
      env:
        RESOLUTION: ${{ matrix.resolution }}
      run: |
        if [ "$RESOLUTION" = latest ]; then
          UV_EXCLUDE_NEWER="$(date -u +%Y-%m-%dT%H:%M:%SZ)" uv sync --upgrade
        else
          uv sync --resolution lowest-direct
        fi
        uv tree --depth 1 --no-dedupe --frozen

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    # The tests run once, without the retry that files flaky tests: a failure
    # here is a version Protostar doesn't work with.
    - name: Run tests
      run: uv run --no-sync pytest -n auto --dist worksteal --durations=25 -o faulthandler_timeout=90 --rollback-scope pr

  # Every fault at every site of a real init (tests/test_rollback.py), one
  # template per job, and on Windows, where each run is slowest, six slices of
  # each so no job runs for hours. Pull requests run it with commands faked.
  rollback:
    name: Rollback (${{ matrix.os }} / ${{ matrix.template }}${{ matrix.slice != '1/1' && format(' {0}', matrix.slice) || '' }})
    needs: [gate, select]
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' && needs.select.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # scripts/nightly_matrix.py: every template on every OS, in six slices
      # on Windows.
      matrix: ${{ fromJSON(needs.select.outputs.rollback) }}

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
        python-version: "3.14"

    - name: Install dependencies
      run: |
        uv sync --only-group ci --only-group annotations --locked

    - name: Fail init at every site
      uses: ./.github/actions/pytest
      with:
        # Concurrent scientific environments compete for disk and CPU on
        # Windows, where uv copies packages and nbdime can exceed its timeout.
        workers: ${{ matrix.os == 'windows-latest' && '1' || 'auto' }}
        args: >-
          tests/test_rollback.py --rollback-scope full --rollback-real all
          --rollback-templates ${{ matrix.template }} -o faulthandler_timeout=300
          --rollback-shard ${{ matrix.slice }}
          --rollback-report rollback-report/report.json
        retry: "true"
        artifact: rollback-${{ matrix.os }}-${{ matrix.template }}-${{ strategy.job-index }}

    # Rollback Metrics adds the reports up. A failing job reports too, so the
    # badge can say how many faults failed.
    - name: Upload the fault report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.artifact }}
        path: rollback-report/report.json
        if-no-files-found: ignore
        retention-days: 7
