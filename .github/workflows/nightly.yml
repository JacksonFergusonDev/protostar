name: Nightly

# The platform combinations CI leaves out of pull requests, run once a day on
# main and before every release. Nightly Report files the outcome as an issue.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: Check for new commits
    # Only the schedule skips: a manual run or a release always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
    - name: Compare with the last passing run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "main is still at ${GITHUB_SHA::7}, which already passed."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  platforms:
    name: Platforms
    needs: gate
    # A failed gate runs the checks anyway, so a broken gate can't hide a broken main.
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' }}
    uses: ./.github/workflows/platforms.yml
    with:
      retry-failed-tests: true
      tests: >-
        [
          {"os": "macos-latest", "python": "3.13"},
          {"os": "windows-latest", "python": "3.13"}
        ]
      smoke: >-
        [
          {"os": "macos-latest", "template": "cli"},
          {"os": "macos-latest", "template": "api"},
          {"os": "macos-latest", "template": "lib"},
          {"os": "windows-latest", "template": "api"},
          {"os": "windows-latest", "template": "lib"}
        ]
