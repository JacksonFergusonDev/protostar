name: Nightly

# Every OS, Python, and built-in template, once a day on main. Pull requests run
# a subset; a release requires Nightly to have passed on the commit it bumps.
# Nightly Report files the outcome as an issue. The run starts 54 jobs, 18 of
# them on macOS, which takes five at a time: a PR opened while it runs waits.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Check for new commits
    # Only the schedule skips: a manual run always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
    - name: Compare with the last passing run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "main is still at ${GITHUB_SHA::7}, which already passed."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  platforms:
    name: Platforms
    needs: gate
    # A failed gate runs the checks anyway, so a broken gate can't hide a broken main.
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' }}
    uses: ./.github/workflows/platforms.yml
    with:
      retry: true
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"]
        }
      smoke: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "template": ["cli", "api", "lib", "astro", "ml"]
        }
