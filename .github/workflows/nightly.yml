name: Nightly

# Once a day on main: the smoke tests pull requests leave out, so the two
# together scaffold every built-in template on every OS and Python, and the
# suite again with retries, which is how a flaky test is found. It also fails
# init at every write and command of every template, with real commands, on
# every OS. A release requires CI and Nightly to have passed on the commit it
# bumps. Nightly Report files the outcome as an issue. After its gate, the run
# starts 26 jobs, eight of them on macOS: a scheduled run has no runner limit.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Check for new commits
    # Only the schedule skips: a manual run always runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
    - name: Compare with the last passing run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        last=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "main is still at ${GITHUB_SHA::7}, which already passed."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  platforms:
    name: Platforms
    needs: gate
    # A failed gate runs the checks anyway, so a broken gate can't hide a broken main.
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' }}
    uses: ./.github/workflows/platforms.yml
    with:
      retry: true
      tests: >-
        {
          "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
          "python": ["3.12", "3.13", "3.14"],
          "include": [
            {"os": "macos-latest", "python": "3.12", "smoke": ["api", "astro", "cli", "lib"]},
            {"os": "macos-latest", "python": "3.13", "smoke": ["cli", "lib", "ml"]},
            {"os": "macos-latest", "python": "3.14", "smoke": ["api", "astro", "ml"]}
          ]
        }
      smoke: >-
        {
          "os": ["windows-latest"],
          "python": ["3.13"],
          "templates": [["cli", "astro", "ml"], ["api", "lib"]]
        }

  # Every fault at every site of a real init (tests/test_rollback.py), one
  # template per job. Pull requests run one scenario of it in the suite.
  rollback:
    name: Rollback (${{ matrix.os }} / ${{ matrix.template }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.changed != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        template: [api, astro, cli, lib, ml]

    env:
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: |
        uv sync --only-group ci --locked
        uv pip install pytest-github-actions-annotate-failures

    - name: Fail init at every site
      uses: ./.github/actions/pytest
      with:
        args: >-
          tests/test_rollback.py --rollback-scope full --rollback-real all
          --rollback-templates ${{ matrix.template }} -o faulthandler_timeout=300
        retry: "true"
        flaky-artifact: flaky-tests-rollback-${{ matrix.os }}-${{ matrix.template }}
