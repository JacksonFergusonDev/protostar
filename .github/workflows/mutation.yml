name: Mutation Testing

# Nightly runs skip unchanged inputs; manual runs remain available for development.
# Each module gets its own runner, in parallel; a module listed
# under [tool.mutmut-shards] in pyproject.toml gets one runner per shard.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated modules to mutate (journal, merge, text_merge, ...), or 'all'. A sharded module takes module:shard to run one shard."
        required: true
        default: all
        type: string

permissions:
  contents: read

# Keep full runs in order without cancelling the work already in progress.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run: ${{ steps.changed.outputs.run }}
      publish: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.modules == 'all') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      with:
        fetch-depth: 0

    - name: Check changed mutation inputs
      id: changed
      env:
        EVENT: ${{ github.event_name }}
      run: |
        if [[ "$EVENT" == "schedule" ]]; then
          git fetch origin gh-pages
          if git cat-file -e origin/gh-pages:benchmarks/mutation-history.json; then
            git show origin/gh-pages:benchmarks/mutation-history.json > mutation-history.json
          fi
          changed="$(python3 scripts/mutation_report.py changed --history mutation-history.json)"
        else
          changed=true
        fi
        echo "run=$changed" >> "$GITHUB_OUTPUT"

    - name: Select modules
      id: matrix
      if: steps.changed.outputs.run == 'true'
      env:
        REQUESTED: ${{ github.event_name == 'schedule' && 'all' || inputs.modules }}
      run: |
        python3 - <<'EOF'
        import json, os, sys, tomllib
        from pathlib import PurePosixPath

        with open("pyproject.toml", "rb") as config:
            tool = tomllib.load(config)["tool"]
        known = [
            ".".join(PurePosixPath(path).relative_to("src/protostar").with_suffix("").parts)
            for path in tool["mutmut"]["source_paths"]
        ]
        shards = tool.get("mutmut-shards", {})
        orphaned = sorted(set(shards) - set(known))
        if orphaned:
            sys.exit(f"Shards for {orphaned}, which are not in source_paths {known}.")
        requested = os.environ["REQUESTED"].replace(" ", "")
        # An item is a module, or module:shard to run one shard of a sharded module.
        if requested == "all":
            items = [(module, "") for module in known]
        else:
            items = [
                (module, shard)
                for module, _, shard in (item.partition(":") for item in requested.split(","))
            ]
        unknown = sorted({m for m, _ in items} - set(known))
        if unknown:
            sys.exit(f"Unknown modules {unknown}; choose from {known} or 'all'.")
        missing = sorted(
            f"{m}:{s}" for m, s in items if s and s not in shards.get(m, {})
        )
        if missing:
            sys.exit(f"Unknown shards {missing}; choose from {shards}.")

        def pattern(module, function):
            # mutmut names a mutant x_<function> or x<ǁ>Class<ǁ>method.
            cls, _, name = function.rpartition(".")
            body = f"xǁ{cls}ǁ{name}" if cls else f"x_{name}"
            return f"protostar.{module}.{body}__mutmut_*"

        include = {}
        for module, only in items:
            if module not in shards:
                include[module] = {
                    "name": module, "artifact": module, "patterns": f"protostar.{module}.*"
                }
                continue
            for shard, functions in shards[module].items():
                if only in ("", shard):
                    include[f"{module}-{shard}"] = {
                        "name": f"{module} ({shard})",
                        "artifact": f"{module}-{shard}",
                        "patterns": " ".join(pattern(module, f) for f in functions),
                    }
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"matrix={json.dumps({'include': list(include.values())}, ensure_ascii=False)}\n")
        EOF

  mutate:
    name: Mutate ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --group mutation --locked

    - name: Mock direnv
      uses: ./.github/actions/mock-direnv

    - name: Mutate ${{ matrix.name }}
      env:
        PATTERNS: ${{ matrix.patterns }}
      run: |
        # A mutant can turn a loop into runaway allocation, which takes the whole
        # runner down ("received a shutdown signal"). Capping each process makes
        # that a MemoryError the suite catches instead.
        ulimit -v 4194304
        read -r -a patterns <<< "$PATTERNS"
        uv run --no-sync mutmut run "${patterns[@]}"

    - name: Summarize
      if: ${{ !cancelled() }}
      run: |
        {
          echo "### ${{ matrix.name }} at ${GITHUB_SHA::7}"
          echo
          uv run --no-sync python scripts/mutation_report.py report \
            --json mutants/summary.json --survivors mutants/survivors.txt
          echo
          echo "Every survivor's change is in the \`mutation-${{ matrix.artifact }}\` artifact, as survivors.md."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Write survivor diffs
      if: ${{ !cancelled() }}
      run: uv run --no-sync python scripts/mutation_report.py diffs --out mutants/survivors.md

    - name: Upload results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-${{ matrix.artifact }}
        path: |
          mutants/summary.json
          mutants/survivors.txt
          mutants/survivors.md
        retention-days: 90
        if-no-files-found: error

  summary:
    name: Combine results
    needs: mutate
    if: ${{ !cancelled() && needs.mutate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: mutation-*
        path: results

    - name: Combine
      run: |
        mapfile -t summaries < <(find results -name summary.json | sort)
        {
          echo "### All modules at ${GITHUB_SHA::7}"
          echo
          python3 scripts/mutation_report.py combine "${summaries[@]}"
        } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Record complete mutation run
    needs: [plan, mutate, summary]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download every mutation result
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: mutation-*
        path: results

    - name: Read the published data branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: gh-pages
        path: pages-data
        fetch-depth: 0

    - name: Append history and latest score
      env:
        MATRIX: ${{ needs.plan.outputs.matrix }}
        COMMIT: ${{ github.sha }}
      run: |
        # Artifact directories have a prefix; the planner's stable names do not.
        for path in results/mutation-*; do
          mv "$path" "results/${path##*/mutation-}"
        done
        recorded_at="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
        git -C pages-data config user.name 'github-actions[bot]'
        git -C pages-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3 4 5; do
          echo "Publishing mutation results (attempt $attempt/5)."
          python3 scripts/mutation_report.py record \
            --results results --matrix "$MATRIX" --commit "$COMMIT" --date "$recorded_at" \
            --history pages-data/benchmarks/mutation-history.json \
            --latest pages-data/benchmarks/mutation-latest.json
          git -C pages-data add benchmarks/mutation-history.json benchmarks/mutation-latest.json
          if ! git -C pages-data diff --cached --quiet; then
            git -C pages-data commit -m "Record engine mutation score for ${COMMIT:0:7}"
          fi
          if git -C pages-data push origin HEAD:gh-pages; then
            exit 0
          fi
          # Benchmarks and releases also write here. Rebase non-conflicting edits;
          # if history itself changed, regenerate against its current contents.
          if ! git -C pages-data pull --rebase origin gh-pages; then
            git -C pages-data rebase --abort
            git -C pages-data reset --hard origin/gh-pages
          fi
        done
        echo 'Could not publish mutation results after five attempts.' >&2
        exit 1

  publish-pages:
    name: Publish updated mutation scores
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
