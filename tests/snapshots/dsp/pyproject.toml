[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pedalboard>=0.9.25",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]
description = "Add your description here."
readme = "README.md"
authors = [{ name = "your-name", email = "your-email@example.com" }]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

# ==================================================
# Tool Configuration
# ==================================================

# ---- Ruff ---- #

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long - handled automatically by `ruff format`
]

# ---- Protostar ---- #

[tool.protostar]
version = 1
mode = "template"
python = "3.13"
docker = false
ide = "none"

[tool.protostar.source]
origin = "built-in"
locator = "dsp"

[tool.protostar.tools]

[tool.protostar.fallback]
ci = false
codecov = false
commitizen = false
direnv = false
just = false
markdownlint = false
mypy = false
pre_commit = false
prek = false
pyrefly = false
pytest = false
readthedocs = false
release = false
renovate = false
ruff = true
rumdl = false
ty = false
zensical = false

[tool.protostar.context]
AUTHOR_NAME = "your-name"
CURRENT_YEAR = "2026"
PACKAGE_NAME = "demo_project"
PROJECT_NAME = "demo-project"
PYTHON_VERSION = "3.13"

[tool.protostar.metadata]

[tool.protostar.bindings]
