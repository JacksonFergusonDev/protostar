[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]
description = "Add your description here."
authors = [{ name = "your-name", email = "your-email@example.com" }]
readme = "README.md"

[project.scripts]
demo-project = "demo_project.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_project"]

# ==================================================
# Tool Configuration
# ==================================================

# ---- Ruff ---- #

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long - handled automatically by `ruff format`
]

# ---- Protostar ---- #

[tool.protostar]
version = 1
mode = "template"
python = "3.13"
ide = "none"
tier = "workbench"

[tool.protostar.source]
origin = "built-in"
locator = "cli"

[tool.protostar.fallback]
agents = false
ci = false
codecov = false
commitizen = false
community = false
direnv = false
docker = false
just = false
markdownlint = false
mypy = false
pre_commit = false
prek = false
pyrefly = false
pytest = false
readthedocs = false
release = false
renovate = false
ruff = true
rumdl = false
ty = false
zensical = false

[tool.protostar.context]
AUTHOR_NAME = "your-name"
CURRENT_YEAR = "2026"
PACKAGE_NAME = "demo_project"
PROJECT_NAME = "demo-project"
PYTHON_VERSION = "3.13"
