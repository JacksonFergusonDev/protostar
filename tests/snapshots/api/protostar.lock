[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
description = "Add your description here."
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows"]

[[project.authors]]
email = "your-email@example.com"
name = "your-name"

[tool.commitizen]
changelog_incremental = true
name = "cz_conventional_commits"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"
version_scheme = "semver2"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_project"]

[tool.mypy]
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
pretty = true
python_version = "3.13"
show_error_codes = true
show_error_context = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
select = ["A", "B", "C4", "E", "F", "I", "RUF", "UP"]

[tool.rumdl]
disable = ["MD013", "MD033", "MD077"]

[tool.rumdl.MD003]
style = "atx"

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD009]
br-spaces = 2
strict = false

[tool.rumdl.MD024]
siblings-only = true

[tool.rumdl.MD029]
style = "one"

[tool.rumdl.per-file-ignores]
"docs/**/*.md" = ["MD041", "MD046"]
"""

