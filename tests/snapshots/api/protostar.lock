  - exclude: \.py$
    id: trailing-whitespace
  - exclude: \.py$
    id: end-of-file-fixer
  - id: check-yaml
  - id: check-json
  - id: check-toml
  repo: builtin
- hooks:
  - entry: uv lock --check
    files: '^(pyproject\.toml|uv\.lock)$'
    id: uv-lock-check
    language: system
    name: uv lock check
    pass_filenames: false
  - entry: uv run rumdl check --fix
    id: rumdl-check
