  - entry: uv run zizmor --offline --no-progress
    files: '(^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$'
    id: zizmor
    language: system
    name: zizmor
    require_serial: true
    types:
    - yaml
  - entry: uv run ruff check --fix
    id: ruff-check
    language: system
    name: ruff check
    require_serial: true
    types:
    - python
  - entry: uv run ruff format
    id: ruff-format
    language: system
    name: ruff format
    require_serial: true
    types:
    - python
  - entry: uv run mypy .
    id: mypy
    language: system
    name: mypy
    pass_filenames: false
    types:
    - python
  - entry: uv run pytest
    files: '^(src/|tests/|pyproject\.toml|uv\.lock)'
    id: pytest
    language: system
    name: pytest
    pass_filenames: false
    stages:
    - pre-push
  - entry: uv run check-jsonschema --builtin-schema vendor.renovate --force-filetype json5
    files: ^\.github/renovate\.json$
    id: check-renovate
    language: system
    name: check renovate config
  repo: local
- hooks:
  - id: gitleaks
  repo: https://github.com/gitleaks/gitleaks
