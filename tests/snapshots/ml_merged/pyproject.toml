[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "matplotlib>=3.11.2",
    "nbdime>=4.0.4",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "photutils>=3.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "specutils>=2.4.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]
description = "Add your description here."
readme = "README.md"
authors = [{ name = "your-name", email = "your-email@example.com" }]

# ==================================================
# Tool Configuration
# ==================================================

# ---- Ruff ---- #

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long - handled automatically by `ruff format`
]
extend-select = ["NPY", "PD"] # NumPy and Pandas specific linting rules

# ---- Pytest ---- #

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.protostar]
version = 1
mode = "template"
python = "3.13"
docker = true
ide = "none"

[tool.protostar.source]
origin = "built-in"
locator = "ml"

[tool.protostar.tools]
mypy = true

[tool.protostar.fallback]
ci = false
codecov = false
commitizen = false
direnv = false
just = false
markdownlint = false
mypy = false
pre_commit = false
prek = false
pyrefly = false
pytest = false
readthedocs = false
release = false
renovate = false
ruff = true
rumdl = false
ty = false
zensical = false

[tool.protostar.context]
AUTHOR_NAME = "your-name"
CURRENT_YEAR = "2026"
PACKAGE_NAME = "demo_project"
PROJECT_NAME = "demo-project"
PYTHON_VERSION = "3.13"

[tool.protostar.metadata]

[tool.protostar.bindings]

# ---- Mypy ---- #

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
pretty = true
show_error_codes = true
show_error_context = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]
docs = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "nbdime>=4.0.4",
]
