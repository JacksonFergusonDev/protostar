name: Bug Report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please search the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and paste any error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or code that shows the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "demo-project version"
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g., 3.13.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - MacOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
