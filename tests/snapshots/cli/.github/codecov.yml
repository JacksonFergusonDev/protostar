coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_not_found: error
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 2%
        if_not_found: success
        if_ci_failed: error
        informational: false

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "tests/**"
  - "docs/**"
  - "scripts/**"
  - "**/__init__.py"
