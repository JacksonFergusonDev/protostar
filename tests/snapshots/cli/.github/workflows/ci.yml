name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Lint Markdown with rumdl
        run: uv run rumdl check --output-format github .

      - name: Check Markdown formatting with rumdl
        run: uv run rumdl fmt --check --output-format github .

      - name: Run Ruff Linter
        run: uv run ruff check --output-format=github .

      - name: Run Ruff Formatter
        run: uv run ruff format --check --output-format=github .

      - name: Run Mypy
        run: uv run mypy src/

  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        python-version: ["3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --locked
          uv pip install pytest-github-actions-annotate-failures

      - name: Run tests with coverage # (for Codecov)
        if: matrix.coverage
        run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run tests # (without coverage to avoid overhead on non-Codecov runs)
        if: ${{ !matrix.coverage }}
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          name: coverage
          fail_ci_if_error: true

      - name: Upload test analytics to Codecov
        if: ${{ matrix.coverage && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          disable_search: true
          report_type: test_results
          name: test-results
