[[files]]
path = "pyproject.toml"
policy = "structured-toml"
baseline = "[project]\nclassifiers = [\"Programming Language :: Python :: 3\", \"Programming Language :: Python :: 3.13\", \"Programming Language :: Python :: 3.14\", \"Operating System :: MacOS\", \"Operating System :: POSIX :: Linux\", \"Operating System :: Microsoft :: Windows\"]\ndescription = \"Add your description here.\"\nreadme = \"README.md\"\n[[project.authors]]\nemail = \"your-email\"\nname = \"your-name\"\n\n[project.scripts]\ndemo-project = \"demo_project.cli:app\"\n\n[tool.commitizen]\nchangelog_incremental = true\nname = \"cz_conventional_commits\"\ntag_format = \"v$version\"\nupdate_changelog_on_bump = true\nversion_provider = \"pep621\"\nversion_scheme = \"semver2\"\n\n[tool.coverage.report]\nfail_under = 90\nomit = [\"**/__init__.py\"]\nshow_missing = true\nskip_covered = true\n\n[tool.coverage.run]\nbranch = true\n\n[tool.mypy]\ncheck_untyped_defs = true\nexplicit_package_bases = true\nmypy_path = \"src\"\npretty = true\npython_version = \"3.13\"\nshow_error_codes = true\nshow_error_context = true\nstrict = true\nwarn_return_any = true\nwarn_unused_configs = true\n\n[[tool.mypy.overrides]]\ndisallow_incomplete_defs = false\ndisallow_untyped_calls = false\ndisallow_untyped_defs = false\nmodule = [\"tests.*\"]\nwarn_return_any = false\n\n[tool.pytest.ini_options]\naddopts = \"--strict-markers\"\npythonpath = [\".\"]\ntestpaths = [\"tests\"]\n\n[tool.ruff]\nline-length = 88\n\n[tool.ruff.lint]\nignore = [\"D100\", \"D104\", \"D107\", \"E501\"]\nselect = [\"A\", \"B\", \"C4\", \"D\", \"E\", \"F\", \"I\", \"N\", \"PT\", \"RET\", \"RUF\", \"SIM\", \"T20\", \"UP\"]\n\n[tool.ruff.lint.per-file-ignores]\n\"tests/*.py\" = [\"T201\", \"D\"]\n\n[tool.ruff.lint.pydocstyle]\nconvention = \"google\"\n\n[tool.rumdl]\ndisable = [\"MD013\", \"MD033\", \"MD077\"]\n\n[tool.rumdl.MD003]\nstyle = \"atx\"\n\n[tool.rumdl.MD004]\nstyle = \"dash\"\n\n[tool.rumdl.MD009]\nbr-spaces = 2\nstrict = false\n\n[tool.rumdl.MD024]\nsiblings-only = true\n\n[tool.rumdl.MD029]\nstyle = \"one\"\n\n[tool.rumdl.per-file-ignores]\n\"docs/**/*.md\" = [\"MD041\", \"MD046\"]\n"

