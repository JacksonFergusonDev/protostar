[[files]]
path = ".pre-commit-config.yaml"
policy = "structured-yaml"
baseline = "default_install_hook_types:\n  - pre-commit\n  - commit-msg\n  - pre-push\ndefault_stages:\n  - pre-commit\nrepos:\n  - hooks:\n      - id: check-added-large-files\n      - id: check-merge-conflict\n      - id: check-case-conflict\n      - id: check-symlinks\n      - id: check-executables-have-shebangs\n      - exclude: \\.py$\n        id: trailing-whitespace\n      - exclude: \\.py$\n        id: end-of-file-fixer\n      - id: check-yaml\n      - id: check-json\n      - id: check-toml\n    repo: builtin\n  - hooks:\n      - entry: uv lock --check\n        files: ^(pyproject\\.toml|uv\\.lock)$\n        id: uv-lock-check\n        language: system\n        name: uv lock check\n        pass_filenames: false\n      - entry: uv run rumdl check --fix\n        id: rumdl-check\n        language: system\n        name: rumdl check\n        require_serial: true\n        types:\n          - markdown\n      - entry: uv run rumdl fmt\n        id: rumdl-fmt\n        language: system\n        name: rumdl fmt\n        require_serial: true\n        types:\n          - markdown\n      - entry: uv run ruff check --fix\n        id: ruff-check\n        language: system\n        name: ruff check\n        require_serial: true\n        types:\n          - python\n      - entry: uv run ruff format\n        id: ruff-format\n        language: system\n        name: ruff format\n        require_serial: true\n        types:\n          - python\n      - entry: uv run mypy .\n        id: mypy\n        language: system\n        name: mypy\n        pass_filenames: false\n        types:\n          - python\n      - entry: uv run pytest\n        files: ^(src/|tests/|pyproject\\.toml|uv\\.lock)\n        id: pytest\n        language: system\n        name: pytest\n        pass_filenames: false\n        stages:\n          - pre-push\n      - entry: uv run check-jsonschema --builtin-schema vendor.renovate --force-filetype json5\n        files: ^\\.github/renovate\\.json$\n        id: check-renovate\n        language: system\n        name: check renovate config\n      - entry: uv run check-jsonschema --builtin-schema vendor.readthedocs\n        files: ^\\.readthedocs\\.yaml$\n        id: check-readthedocs\n        language: system\n        name: check read the docs config\n      - entry: uv run actionlint\n        files: ^\\.github/workflows/.*\\.ya?ml$\n        id: actionlint\n        language: system\n        name: actionlint\n    repo: local\n  - hooks:\n      - id: gitleaks\n    repo: https://github.com/gitleaks/gitleaks\n    rev: v8.30.1\n  - hooks:\n      - id: commitizen\n        stages:\n          - commit-msg\n    repo: https://github.com/commitizen-tools/commitizen\n    rev: v4.18.1\n"

