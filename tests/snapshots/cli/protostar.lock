path = ".github/workflows/ci.yml"
policy = "structured-yaml"
baseline = """
jobs:
  lint:
    name: 'Lint & Type Check'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        enable-cache: true
        python-version: '3.13'
    - name: Install dependencies
      run: uv sync --all-extras --dev --locked
    - name: Lint Markdown with rumdl
      run: uv run rumdl check --output-format github .
    - name: Check Markdown formatting with rumdl
      run: uv run rumdl fmt --check --output-format github .
    - env:
        GH_TOKEN: ${{ github.token }}
      name: Run zizmor
      run: uv run zizmor --format=github .
    - name: Run Ruff Linter
      run: uv run ruff check --output-format=github .
    - name: Run Ruff Formatter
      run: uv run ruff format --check --output-format=github .
    - name: Run Mypy
      run: uv run mypy .
    - name: Run actionlint
      uses: raven-actions/actionlint@v2
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev --locked
        uv pip install pytest-github-actions-annotate-failures
    - name: Run tests
      run: "uv run pytest ${{ matrix.coverage && '--cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy' || '' }}"
    - if: matrix.coverage
      name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        disable_search: true
        fail_ci_if_error: true
        files: coverage.xml
        name: coverage
        token: ${{ secrets.CODECOV_TOKEN }}
    - if: '${{ matrix.coverage && !cancelled() }}'
      name: Upload test analytics to Codecov
      uses: codecov/codecov-action@v7
      with:
        disable_search: true
        files: junit.xml
        name: test-results
        report_type: test_results
        token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        include:
        - coverage: true
          os: ubuntu-latest
          python-version: '3.14'
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest
        python-version:
        - '3.13'
        - '3.14'
name: CI
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
"""

