[[files]]
path = ".github/workflows/ci.yml"
policy = "structured-yaml"
baseline = "jobs:\n  lint:\n    name: Lint & Type Check\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Install uv\n        uses: astral-sh/setup-uv@v10.0.0\n        with:\n          enable-cache: true\n          python-version: '3.13'\n      - name: Install dependencies\n        run: uv sync --all-extras --dev --locked\n      - name: Lint Markdown with rumdl\n        run: uv run rumdl check --output-format github .\n      - name: Check Markdown formatting with rumdl\n        run: uv run rumdl fmt --check --output-format github .\n      - name: Run Ruff Linter\n        run: uv run ruff check --output-format=github .\n      - name: Run Ruff Formatter\n        run: uv run ruff format --check --output-format=github .\n      - name: Run Mypy\n        run: uv run mypy .\n      - name: Run actionlint\n        run: uv run actionlint\n  test:\n    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}\n    runs-on: ${{ matrix.os }}\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Install uv\n        uses: astral-sh/setup-uv@v10.0.0\n        with:\n          enable-cache: true\n          python-version: ${{ matrix.python-version }}\n      - name: Install dependencies\n        run: \"uv sync --all-extras --dev --locked\\nuv pip install pytest-github-actions-annotate-failures\\n\"\n      - name: Run tests\n        run: uv run pytest ${{ matrix.coverage && '--cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy' || '' }}\n      - if: matrix.coverage\n        name: Upload coverage to Codecov\n        uses: codecov/codecov-action@v7\n        with:\n          disable_search: true\n          fail_ci_if_error: true\n          files: coverage.xml\n          name: coverage\n          token: ${{ secrets.CODECOV_TOKEN }}\n      - if: ${{ matrix.coverage && !cancelled() }}\n        name: Upload test analytics to Codecov\n        uses: codecov/codecov-action@v7\n        with:\n          disable_search: true\n          files: junit.xml\n          name: test-results\n          report_type: test_results\n          token: ${{ secrets.CODECOV_TOKEN }}\n    strategy:\n      matrix:\n        include:\n          - coverage: true\n            os: ubuntu-latest\n            python-version: '3.14'\n        os:\n          - macos-latest\n          - ubuntu-latest\n          - windows-latest\n        python-version:\n          - '3.13'\n          - '3.14'\nname: CI\non:\n  pull_request:\n    branches:\n      - main\n  push:\n    branches:\n      - main\n"

