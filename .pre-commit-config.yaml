repos:
  # 1. Generic hooks (configured to IGNORE Python)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.py$
      - id: end-of-file-fixer
        exclude: \.py$
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files

  # 2. Local Python Toolchain (Managed via uv.lock)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: true

  # 3. Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  # 4. Renovate configuration validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.24.3
    hooks:
      - id: renovate-config-validator
        files: '.github/renovate.json'
