default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

fail_fast: true

repos:
  # Generic hooks (configured to IGNORE Python)
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
        exclude: \.py$
      - id: end-of-file-fixer
        exclude: \.py$|\.gitkeep$
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Local Python + Markdown Toolchain (Managed via uv.lock)
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: ^(docs/|site/|tests/snapshots/)
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^(docs/|site/|tests/snapshots/)
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^(docs/|site/|tests/snapshots/)

      - id: rumdl-check
        name: rumdl check
        entry: uv run rumdl check --fix
        language: system
        types: [markdown]
        require_serial: true

      - id: rumdl-fmt
        name: rumdl fmt
        entry: uv run rumdl fmt
        language: system
        types: [markdown]
        require_serial: true

      # --- Pre-push hooks --- #

      - id: zensical-build
        name: zensical build
        entry: uv run zensical build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|zensical\.toml|README\.md|src/|tests/snapshots/)
        stages: [pre-push]

      - id: check-doc-links
        name: check embedded doc links
        entry: uv run python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: ^(docs/|src/protostar/docs_registry\.py|scripts/check_doc_links\.py)
        stages: [pre-push]

      - id: pytest-unit
        name: pytest unit tests
        entry: uv run pytest -m "not integration and not exhaustive"
        language: system
        pass_filenames: false
        files: ^(src/|tests/|pyproject\.toml|uv\.lock)
        stages: [pre-push]

      - id: check-snapshots
        name: check snapshot drift
        entry: uv run python scripts/run_snapshots.py
        language: system
        pass_filenames: false
        files: ^(src/|scripts/(run_snapshots|generate_docs_assets)\.py|tests/snapshots/|docs/generated/|docs/assets/terminals/|pyproject\.toml|uv\.lock)
        stages: [pre-push]

  # Check for accidental commits of secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit message validation
  - repo: https://github.com/Goldziher/gitfluff
    rev: v0.8.0
    hooks:
      - id: gitfluff-lint
        args: [--write]
        stages: [commit-msg]

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.24.3
    hooks:
      - id: renovate-config-validator
        files: '.github/renovate.json'

  # GitHub Actions workflow validation
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
