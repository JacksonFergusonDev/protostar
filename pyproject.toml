[project]
name = "protostar"
version = "0.10.2"
description = "Simple Python project scaffolding that understands your tools."
readme = "README.md"
authors = [{ name = "Jackson Ferguson", email = "jackson.ferguson0@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.6.3",
    "packaging>=26.3",
    "pygments>=2.21.0",
    "rich>=14.2.0",
    "rich-argparse>=1.7.2",
    "ruamel-yaml>=0.19.1,<0.20",
    "textual>=8.2.8",
    "tomlkit>=0.14.0",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/jacksonfergusondev/protostar"
Issues = "https://github.com/jacksonfergusondev/protostar/issues"
PyPi = "https://pypi.org/project/protostar/"
Documentation = "https://protostar.jacksonferguson.me/"

[project.scripts]
protostar = "protostar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.vscode",
    "/demo",
    "/docs",
    "/overrides",
    "/scripts",
    "/zensical.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protostar"]
include = ["src/protostar/**/*.py", "src/protostar/**/*.toml"]

[dependency-groups]
ci = [
    "actionlint-py>=1.7.12.24",
    "check-jsonschema>=0.38.0",
    "hypothesis>=6.168.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.13",
    "rumdl>=0.2.63",
    "types-pygments>=2.21.0.20260819",
]
docs = [
    "llmstxt-standalone>=0.2.0",
    "mkdocstrings[python]>=1.0.3",
    "zensical>=0.0.26",
]
dev = [
    { include-group = "ci" },
    { include-group = "docs" },
    "prek>=0.4.11",
    "pytest-asyncio>=1.4.0",
    "pytest-textual-snapshot>=1.0.0",
]
mutation = [
    "mutmut>=3.8.0",
]

# ==================================================
# Tool Configuration
# ==================================================

# ---- ruff ---- #

[tool.ruff]
target-version = "py312"
# _secret_rules.py is generated; its --check compares bytes, so formatters stay off it.
extend-exclude = ["docs", "site", "mutants", "tests/snapshots", "src/protostar/_secret_rules.py"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = ["D100", "D104", "D107", "E501", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["protostar"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["T201", "D", "S"]
"scripts/**/*.py" = ["T201", "D", "S", "SIM", "E402"]

# ---- mypy ---- #

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true
exclude = ["^docs/", "^site/", "^mutants/", "^tests/snapshots/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

# scripts/render_og_card.py runs under `uv run --with playwright`.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true

# ---- pytest ---- #

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
norecursedirs = ["snapshots", ".*", "build", "dist", "venv"]
pythonpath = ["."]
markers = ["integration: runs real subprocesses in an isolated workspace"]

[tool.coverage.run]
source = ["src/protostar"]
branch = true

[tool.coverage.report]
omit = ["src/protostar/**/__init__.py"]
show_missing = true
skip_covered = true
fail_under = 85

# ---- mutmut ---- #

# Mutation testing: `just mutate` locally, or the manual Mutation Testing workflow.
# `also_copy` lists what the suite reads from disk; mutmut runs it from a copy.
[tool.mutmut]
source_paths = [
    "src/protostar/appends.py",
    "src/protostar/dependencies.py",
    "src/protostar/documents/pyproject_layout.py",
    "src/protostar/fs_transaction.py",
    "src/protostar/journal.py",
    "src/protostar/jsonc_ast.py",
    "src/protostar/manifest.py",
    "src/protostar/merge.py",
    "src/protostar/reconciliation.py",
    "src/protostar/sync_state.py",
    "src/protostar/text_merge.py",
    "src/protostar/toml_ast.py",
    "src/protostar/toml_lines.py",
    "src/protostar/yaml_ast.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut reads a pragma only at the end of a statement; this applies it to the line
# it is on, such as one argument of a call. Mark only mutants that cannot change
# behavior, and say why on the line above.
do_not_mutate_patterns = ["# pragma: no mutate"]
also_copy = [
    ".github/",
    "benchmarks/",
    "AGENTS.md",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "benchmarks/",
    "docs/",
    "justfile",
    "overrides/",
    "scripts/",
    "src/",
    "zensical.toml",
]

# A module too slow for one runner is split by function: one runner per shard, named for its
# largest function (the split balances size, not topic). Shards must cover every function
# exactly once; tests/test_mutation_workflow.py checks.
[tool.mutmut-shards.reconciliation]
append-files = [
    "Reconciliation._append_files",
    "Reconciliation._migrate",
    "Reconciliation._locate",
    "Reconciliation._proposing",
    "Reconciliation._resolve",
    "Reconciliation.workspace_root",
    "Reconciliation._write_release_workflow",
]
dependency-includes = [
    "Reconciliation._apply_dependency_includes",
    "Reconciliation._release_undeclared_generated",
    "Reconciliation._write_pre_commit_config",
    "Reconciliation._settle_retired",
    "Reconciliation._outside_root_table",
    "Reconciliation._release_seed",
    "Reconciliation._file_record",
    "Reconciliation._seed",
]
dependency-selection = [
    "Reconciliation._select_dependencies",
    "Reconciliation._write_injected_files",
    "Reconciliation._report",
    "Reconciliation._follow",
    "Reconciliation._write_justfile",
    "Reconciliation._create_directories",
    "Reconciliation.interpolation_context",
    "Reconciliation._migrated",
]
generated-files = [
    "Reconciliation._write_generated",
    "Reconciliation._materialize_dependencies",
    "Reconciliation._release_undeclared_dependencies",
    "Reconciliation._rename_seed",
    "Reconciliation._validate_node",
    "Reconciliation.add_diagnostic",
    "Reconciliation._own",
    "Reconciliation._write_workflow",
]
targets-and-docker = [
    "Reconciliation._validate_targets",
    "Reconciliation._write_docker_artifacts",
    "Reconciliation._write_ide_settings",
    "Reconciliation.__init__",
    "Reconciliation._release_undeclared_seeds",
    "Reconciliation._remove_seed",
    "Reconciliation._merge_warning",
    "Reconciliation._existing",
]
documents = [
    "Reconciliation._release_undeclared_documents",
    "Reconciliation._reconcile_document",
    "Reconciliation._load_state",
    "Reconciliation._write_ignores",
    "Reconciliation._write_recipe",
    "Reconciliation._write_ci_workflow",
    "Reconciliation._layout_warning",
    "Reconciliation._release_document",
]

# ---- rumdl  ---- #

[tool.rumdl]
disable = [
    "MD013", # line length - creates unnecessary diff churn
    "MD033", # inline HTML – required for readme and parts of documentation
    "MD077", # continuation line indentation – we intentionally use 4 spaces for visual clarity
]

# --- Heading style ---
# Enforce ATX style (# Heading) exclusively; setext (underlined) headings are not allowed
[tool.rumdl.MD003]
style = "atx"

# --- Unordered list style ---
# Use dash (-) for list markers – cleaner than * or +, and reduces git diff noise
[tool.rumdl.MD004]
style = "dash"

# --- Trailing spaces ---
# Allow exactly 2 spaces for hard line breaks (Markdown standard); flag any other stray whitespace
[tool.rumdl.MD009]
br-spaces = 2
strict = false

# --- Duplicate headings ---
# Allow identical subheadings (e.g., "Parameters") as long as they appear under different parent headings
[tool.rumdl.MD024]
siblings-only = true

# --- Ordered list numbering ---
# Use "one" style (1., 1., 1.) so reordering list items doesn't create massive diff churn
[tool.rumdl.MD029]
style = "one"

# --- Per‑directory overrides for docs/ ---
# Relax rules that conflict with Zensical / Python‑Markdown extensions
[tool.rumdl.per-file-ignores]
"docs/**/*.md" = [
    "MD041", # first line need not be a top‑level heading
    "MD046", # code block style – Zensical extensions require mixing fenced and indented blocks for admonitions/tabs
]
