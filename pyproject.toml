[project]
name = "protostar"
version = "0.8.3"
description = "High-velocity, zero-friction environment scaffolding."
readme = "README.md"
authors = [{ name = "Jackson Ferguson", email = "jackson.ferguson0@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "argcomplete>=3.6.3",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "rich-argparse>=1.7.2",
    "tomlkit>=0.14.0",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/jacksonfergusondev/protostar"
Issues = "https://github.com/jacksonfergusondev/protostar/issues"
PyPi = "https://pypi.org/project/protostar/"
Documentation = "https://protostar.readthedocs.io/en/stable/"

[project.scripts]
protostar = "protostar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.vscode",
    "/demo",
    "/docs",
    "/scripts",
    "/mkdocs.yml",
    "/.readthedocs.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protostar"]
include = ["src/protostar/**/*.py", "src/protostar/**/*.toml"]

[dependency-groups]
ci = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.13",
    "rumdl>=0.2.63",
]
docs = ["mkdocstrings[python]>=1.0.3", "zensical>=0.0.26"]
dev = [{ include-group = "ci" }, { include-group = "docs" }, "prek>=0.4.11"]

# ==================================================
# Tool Configuration
# ==================================================

# ---- ruff ---- #

[tool.ruff]
target-version = "py312"
extend-exclude = ["docs", "site"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = ["D100", "D104", "D107", "E501", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["protostar"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["T201", "D", "S"]
"scripts/*.py" = ["T201", "D", "S", "SIM"]

# ---- mypy ---- #

[tool.mypy]
mypy_path = "src"
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true
exclude = ["^docs/", "^site/"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

# ---- pytest ---- #

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that perform actual disk I/O and subprocess calls",
    "exhaustive: marks heavy combinatorial tests",
]

[tool.coverage.run]
source = ["src/protostar"]
branch = true

[tool.coverage.report]
omit = ["src/protostar/**/__init__.py"]
show_missing = true
skip_covered = true
fail_under = 85

# ---- rumdl  ---- #

[tool.rumdl]
disable = [
    "MD013", # line length - creates unnecessary diff churn
    "MD033", # inline HTML – required for readme and parts of documentation
    "MD077", # continuation line indentation – we intentionally use 4 spaces for visual clarity
]

# --- Heading style ---
# Enforce ATX style (# Heading) exclusively; setext (underlined) headings are not allowed
[tool.rumdl.MD003]
style = "atx"

# --- Unordered list style ---
# Use dash (-) for list markers – cleaner than * or +, and reduces git diff noise
[tool.rumdl.MD004]
style = "dash"

# --- Trailing spaces ---
# Allow exactly 2 spaces for hard line breaks (Markdown standard); flag any other stray whitespace
[tool.rumdl.MD009]
br-spaces = 2
strict = false

# --- Duplicate headings ---
# Allow identical subheadings (e.g., "Parameters") as long as they appear under different parent headings
[tool.rumdl.MD024]
siblings-only = true

# --- Ordered list numbering ---
# Use "one" style (1., 1., 1.) so reordering list items doesn't create massive diff churn
[tool.rumdl.MD029]
style = "one"

# --- Per‑directory overrides for docs/ ---
# Relax rules that conflict with Zensical / Python‑Markdown extensions
[tool.rumdl.per-file-ignores]
"docs/**/*.md" = [
    "MD041", # first line need not be a top‑level heading
    "MD046", # code block style – Zensical extensions require mixing fenced and indented blocks for admonitions/tabs
]
