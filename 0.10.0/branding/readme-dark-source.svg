<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      .wordmark {
        font: bold 90px "Space Grotesk";
        fill: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        .wordmark { fill: #0f172a; }
      }
    </style>
  </defs>

  <g transform="translate(100, 100)">
    <rect x="-96" y="-96" width="192" height="192" rx="40" fill="#0f172a"/>

    <line x1="0" y1="-70" x2="0" y2="-18" stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>
    <line x1="0" y1="70"  x2="0" y2="18"  stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>

    <line x1="-60.6" y1="-35" x2="-15.6" y2="-9"  stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>
    <line x1="60.6"  y1="35"  x2="15.6"  y2="9"   stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>

    <line x1="60.6"  y1="-35" x2="15.6"  y2="-9"  stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>
    <line x1="-60.6" y1="35"  x2="-15.6" y2="9"   stroke="#22d3ee" stroke-width="11" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="16" fill="#0f172a"/>
    <circle cx="0" cy="0" r="10" fill="#22d3ee"/>
    <circle cx="0" cy="0" r="4"  fill="#ffffff" opacity="0.95"/>
  </g>

  <text x="220" y="135" class="wordmark">Protostar</text>
</svg>
