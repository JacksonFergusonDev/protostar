site_name: Protostar
site_description: High-velocity, zero-friction python environment scaffolding.
site_url: https://protostar.readthedocs.io/en/stable/
repo_url: https://github.com/jacksonfergusondev/protostar
repo_name: jacksonfergusondev/protostar
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Jackson Ferguson. <a href=\"https://github.com/jacksonfergusondev/protostar/blob/main/LICENSE\">License</a>"

nav:
  - Home: index.md
  - Why Protostar?: why-protostar.md
  - Getting Started: getting-started.md
  - Usage:
    - Initialization: usage/init.md
    - Templates & Portable Configs: usage/templates.md
    - Authoring Templates: usage/authoring-templates.md
    - Configuration: usage/configuration.md
    - Agent & Machine Interface: usage/agent-interface.md
  - Flags & Tooling:
    - Built-in Templates: flags/templates.md
    - Tooling Modules: flags/tooling.md
  - Mechanics:
    - Manifest: mechanics/manifest.md
    - Orchestrator: mechanics/orchestrator.md
    - Executor: mechanics/executor.md
    - Modules: mechanics/modules.md
    - Error Handling: mechanics/error_handling.md
  - Mission Control:
    - Overview: mission-control/overview.md
    - Extending Protostar: mission-control/extending-protostar.md
    - Testing: mission-control/testing.md
    - API Reference: mission-control/api-reference.md


theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # 1. Dark Mode (Forced default for all users)
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # 2. Light Mode (Low-entropy fallback)
    - scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/space-awesome
    admonition:
      note: material/telescope
      tip: material/rocket-launch
      warning: material/alert
      info: material/satellite-variant
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["docs/fixtures", "."]
      check_paths: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            members_order: source
  - search

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.8.1/dist/bundle/asciinema-player.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.8.1/dist/bundle/asciinema-player.min.js
  - javascripts/asciinema-init.js

extra:
  generator: false
