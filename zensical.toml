[project]
site_name = "Protostar"
site_description = "High-velocity, zero-friction python environment scaffolding."
site_url = "https://protostar.readthedocs.io/stable/"
repo_url = "https://github.com/jacksonfergusondev/protostar"
repo_name = "jacksonfergusondev/protostar"
copyright = "&copy; 2026 Jackson Ferguson. <a href=\"https://github.com/jacksonfergusondev/protostar/blob/main/LICENSE\">License</a>"

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "Why Protostar?" = "why-protostar.md" },
    { "Design Principles" = "design-principles.md" },
    { "User Guide" = [
        { "Initialization" = "usage/init.md" },
        { "Templates & Portable Configs" = "usage/templates.md" },
        { "Authoring Templates" = "usage/authoring-templates.md" },
        { "Tooling & Flags Matrix" = "usage/tooling-matrix.md" },
        { "Global Configuration" = "usage/configuration.md" },
        { "Agent & Machine Interface" = "usage/agent-interface.md" },
        { "CLI Reference" = "usage/cli-reference.md" },
        { "Troubleshooting & FAQ" = "usage/troubleshooting.md" },
    ] },
    { "Mechanics" = [
        { "Manifest" = "mechanics/manifest.md" },
        { "Orchestrator" = "mechanics/orchestrator.md" },
        { "Executor" = "mechanics/executor.md" },
        { "Modules" = "mechanics/modules.md" },
        { "Error Handling" = "mechanics/error_handling.md" },
    ] },
    { "Developer Guide" = [
        { "Overview" = "developer/overview.md" },
        { "Extending Protostar" = "developer/extending-protostar.md" },
        { "Testing & Philosophy" = "developer/testing.md" },
        { "API Reference" = "developer/api-reference.md" },
    ] },
]

extra_css = [
    "stylesheets/extra.css",
    "https://cdn.jsdelivr.net/npm/asciinema-player@3.8.1/dist/bundle/asciinema-player.css",
]
extra_javascript = [
    { path = "https://cdn.jsdelivr.net/npm/asciinema-player@3.8.1/dist/bundle/asciinema-player.min.js", defer = true },
    { path = "javascripts/asciinema-init.js", defer = true },
]

[project.theme]
name = "material"
logo = "assets/favicon.svg"
favicon = "assets/favicon.png"

features = [
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "cyan"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "cyan"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[project.theme.icon]
repo = "fontawesome/brands/space-awesome"

[project.theme.icon.admonition]
note = "material/telescope"
tip = "material/rocket-launch"
warning = "material/alert"
info = "material/satellite-variant"

[project.plugins.mkdocstrings]
handlers.python.options.show_root_heading = true
handlers.python.options.show_source = true
handlers.python.options.members_order = "source"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jacksonfergusondev/protostar"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/jackson--ferguson/"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:jackson.ferguson0@gmail.com"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.snippets" = { base_path = ["docs/fixtures", "."], check_paths = true }
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
