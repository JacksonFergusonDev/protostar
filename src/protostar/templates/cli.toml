# Built-in template. Product tier: a published command-line package, full quality gate by default.
# Contract: docs/developer/built-in-templates.md

name = "CLI"
description = "Rich & Typer command-line application"

# --- Dependencies ---
dependencies = ["typer", "rich"]

# --- Directory Architecture ---
directories = ["src/<% PACKAGE_NAME %>", "tests"]

# --- Tooling Opinions ---
ruff = true
direnv = true
mypy = true
pytest = true
prek = true
commitizen = true
renovate = true
codecov = true
just = true
zensical = true
ci = true
release = true
readthedocs = true
rumdl = true

# --- Development Dependencies ---
[dev]
dev_dependencies = ["pytest-cov"]

# --- pyproject.toml AST Injections ---
[dev.pyproject]
# Additive on top of the Ruff module's baseline (A, B, C4, E, F, I, RUF, UP).
# Sequences merge atomically, so `select` must not be redefined here; and
# `ignore` replaces the module's list, so it keeps E501 alongside the D rules.
cli_ruff_config = '''
[tool.ruff.lint]
extend-select = [
    "D",   # pydocstyle
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "E501", # Line too long - handled automatically by `ruff format`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["T201", "D"]
'''

# Only the delta from the Mypy module's baseline: strict mode for the package,
# relaxed for tests. The tests override turns off warn_return_any, which the
# baseline enables, because test doubles routinely return Any.
cli_mypy_config = '''
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
'''

cli_pytest_config = '''
[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["**/__init__.py"]
show_missing = true
skip_covered = true
fail_under = 90
'''

# The scaffold is an installable package: src layout with a real build backend, so
# tests import it like any consumer would and the console script / container
# entrypoint resolve. Hatchling needs no version bound, unlike uv_build.
cli_build_system = '''
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/<% PACKAGE_NAME %>"]
'''

cli_entrypoint = '''
[project.scripts]
<% PROJECT_NAME %> = "<% PACKAGE_NAME %>.cli:app"
'''

# --- Static File Injections ---
[files]
"src/<% PACKAGE_NAME %>/__init__.py" = '''
"""<% PROJECT_NAME %>."""

import contextlib
import importlib.metadata

__version__ = "unknown"
with contextlib.suppress(importlib.metadata.PackageNotFoundError):
    __version__ = importlib.metadata.version("<% PROJECT_NAME %>")
'''

"src/<% PACKAGE_NAME %>/cli.py" = '''
"""Command-line interface for <% PROJECT_NAME %>."""

import typer
from rich.console import Console

from <% PACKAGE_NAME %> import __version__

APP_NAME = "<% PROJECT_NAME %>"

app = typer.Typer(
    name=APP_NAME,
    help=f"Command-line interface for {APP_NAME}.",
    add_completion=False,
)
console = Console()


def version_callback(value: bool) -> None:
    """Print the version and exit eagerly."""
    if value:
        console.print(f"{APP_NAME} version [bold cyan]{__version__}[/bold cyan]")
        raise typer.Exit()


@app.callback()
def main(
    version: bool = typer.Option(
        None,
        "--version",
        help="Show the application version and exit.",
        callback=version_callback,
        is_eager=True,
    ),
) -> None:
    """Configure global CLI state."""


if __name__ == "__main__":
    app()
'''

"tests/test_cli.py" = '''
"""Tests for the <% PROJECT_NAME %> CLI."""

from typer.testing import CliRunner

from <% PACKAGE_NAME %>.cli import app

runner = CliRunner()


def test_version() -> None:
    """Test the --version flag displays the version."""
    result = runner.invoke(app, ["--version"])
    assert result.exit_code == 0
    assert "<% PROJECT_NAME %> version" in result.stdout


def test_help() -> None:
    """Test the --help flag displays the help message."""
    result = runner.invoke(app, ["--help"])
    assert result.exit_code == 0
    assert "<% PROJECT_NAME %>" in result.stdout
'''

"README.md" = '''
# <% PROJECT_NAME %>

Command-line interface for <% PROJECT_NAME %>.
'''
