# --- Dependencies ---
dependencies = ["typer", "rich"]

# --- Directory Architecture ---
directories = ["src/<% PACKAGE_NAME %>", "tests"]

# --- Tooling Opinions ---
ruff = true
direnv = true
mypy = true
pytest = true
prek = true
commitizen = true
renovate = true
codecov = true
just = true
zensical = true
ci = true
release = true
readthedocs = true
markdownlint = true

# --- Development Dependencies ---
[dev]
extra_dependencies = ["pytest-cov"]

# --- pyproject.toml AST Injections ---
[dev.pyproject]
cli_ruff_config = '''
[tool.ruff.lint]
__replace__ = true
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "E501", # Line too long - handled automatically by `ruff format`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["T201", "D"]
'''

cli_mypy_config = '''
[tool.mypy]
__replace__ = true
mypy_path = "src"
python_version = "<% PYTHON_VERSION %>"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
'''

cli_pytest_config = '''
[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["**/__init__.py"]
show_missing = true
skip_covered = true
fail_under = 90
'''

cli_entrypoint = '''
[project.scripts]
<% PROJECT_NAME %> = "<% PACKAGE_NAME %>.cli:app"
'''

# --- Static File Injections ---
[files]
"src/<% PACKAGE_NAME %>/__init__.py" = '''
"""<% PROJECT_NAME %>"""

import contextlib
import importlib.metadata

__version__ = "unknown"
with contextlib.suppress(importlib.metadata.PackageNotFoundError):
    __version__ = importlib.metadata.version("<% PROJECT_NAME %>")
'''

"src/<% PACKAGE_NAME %>/cli.py" = '''
"""Command-line interface for <% PROJECT_NAME %>."""

import typer
from rich.console import Console

from <% PACKAGE_NAME %> import __version__

app = typer.Typer(
    name="<% PROJECT_NAME %>",
    help="Command-line interface for <% PROJECT_NAME %>.",
    add_completion=False,
)
console = Console()


def version_callback(value: bool) -> None:
    """Print the version and exit eagerly."""
    if value:
        console.print(f"<% PROJECT_NAME %> version [bold cyan]{__version__}[/bold cyan]")
        raise typer.Exit()


@app.callback()
def main(
    version: bool = typer.Option(
        None,
        "--version",
        help="Show the application version and exit.",
        callback=version_callback,
        is_eager=True,
    ),
) -> None:
    """Configure global CLI state."""


if __name__ == "__main__":
    app()
'''

"tests/test_cli.py" = '''
"""Tests for the <% PROJECT_NAME %> CLI."""

from typer.testing import CliRunner

from <% PACKAGE_NAME %>.cli import app

runner = CliRunner()


def test_version() -> None:
    """Test the --version flag displays the version."""
    result = runner.invoke(app, ["--version"])
    assert result.exit_code == 0
    assert "<% PROJECT_NAME %> version" in result.stdout


def test_help() -> None:
    """Test the --help flag displays the help message."""
    result = runner.invoke(app, ["--help"])
    assert result.exit_code == 0
    assert "<% PROJECT_NAME %>" in result.stdout
'''

"README.md" = '''
# <% PROJECT_NAME %>

Command-line interface for <% PROJECT_NAME %>.
'''
