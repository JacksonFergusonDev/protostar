# Built-in template. Product tier: a deployed web service, full quality gate by default.
# Contract: docs/developer/built-in-templates.md

name = "FastAPI"
description = "FastAPI web application scaffold with Uvicorn and Pydantic"

# --- Dependencies ---
dependencies = ["fastapi", "uvicorn", "pydantic-settings"]

# --- Directory Architecture ---
directories = [
    "src/<% PACKAGE_NAME %>/api/routers",
    "src/<% PACKAGE_NAME %>/core",
    "src/<% PACKAGE_NAME %>/models",
    "src/<% PACKAGE_NAME %>/schemas",
    "src/<% PACKAGE_NAME %>/services",
    "tests/api",
]

# --- Version Control Ignores ---
vcs_ignores = [".env", "*.pem", "*.key", "sqlite.db"]

# --- Tooling Opinions ---
ruff = true
direnv = true
mypy = true
pytest = true
docker = true
just = true
rumdl = true
prek = true
ci = true
commitizen = true
renovate = true

# --- Development Dependencies ---
# Tied to the tool that needs them, so `--no-pytest` does not install them.
[dev.tool_dependencies]
pytest = ["httpx", "pytest-asyncio"]

# --- pyproject.toml AST Injections ---
# The scaffold is an installable package: src layout with a real build backend, so
# tests import it like any consumer would and the container build can install it.
# Hatchling needs no version bound, unlike uv_build.
[dev.pyproject]
api_build_system = '''
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/<% PACKAGE_NAME %>"]
'''

# --- Static File Injections ---
[files]
"src/<% PACKAGE_NAME %>/core/config.py" = '''
"""Configuration settings for <% PROJECT_NAME %>."""

from pydantic_settings import BaseSettings, SettingsConfigDict


class Settings(BaseSettings):
    """Application settings schema."""

    model_config = SettingsConfigDict(env_file=".env")

    project_name: str = "<% PROJECT_NAME %>"
    api_v1_str: str = "/api/v1"


settings = Settings()
'''

"src/<% PACKAGE_NAME %>/main.py" = '''
"""Application entrypoint for <% PROJECT_NAME %>."""

from fastapi import FastAPI

from .core.config import settings

app = FastAPI(
    title=settings.project_name,
    openapi_url=f"{settings.api_v1_str}/openapi.json",
)


@app.get("/health")
async def health_check() -> dict[str, str]:
    """Health check endpoint."""
    return {"status": "ok"}
'''

"tests/test_health.py" = '''
"""Tests for the <% PROJECT_NAME %> health endpoint."""

import pytest
from httpx import ASGITransport, AsyncClient

from <% PACKAGE_NAME %>.main import app


@pytest.mark.asyncio
async def test_health_check() -> None:
    """The health endpoint reports an ok status."""
    transport = ASGITransport(app=app)
    async with AsyncClient(transport=transport, base_url="http://test") as client:
        response = await client.get("/health")

    assert response.status_code == 200
    assert response.json() == {"status": "ok"}
'''

"README.md" = '''
# <% PROJECT_NAME %>

FastAPI service for <% PROJECT_NAME %>.
'''

".env.example" = '''
# API Configuration
PROJECT_NAME="<% PROJECT_NAME %>"
'''
