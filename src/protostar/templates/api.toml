# --- Dependencies ---
dependencies = ["fastapi", "uvicorn", "pydantic-settings"]

# --- Directory Architecture ---
directories = [
    "src/<% PACKAGE_NAME %>/api/routers",
    "src/<% PACKAGE_NAME %>/core",
    "src/<% PACKAGE_NAME %>/models",
    "src/<% PACKAGE_NAME %>/schemas",
    "src/<% PACKAGE_NAME %>/services",
    "tests/api",
]

# --- Version Control Ignores ---
vcs_ignores = [".env", "*.pem", "*.key", "sqlite.db"]

# --- Tooling Opinions ---
ruff = true
direnv = true
mypy = true
pytest = true
docker = true
just = true
markdownlint = true
prek = true
ci = true
commitizen = true
renovate = true

# --- Development Dependencies ---
[dev]
dev_dependencies = ["httpx", "pytest-asyncio"]

# --- Static File Injections ---
[files]
"src/<% PACKAGE_NAME %>/core/config.py" = '''
"""Configuration settings for <% PROJECT_NAME %>."""

from pydantic_settings import BaseSettings


class Settings(BaseSettings):
    """Application settings schema."""

    project_name: str = "<% PROJECT_NAME %>"
    api_v1_str: str = "/api/v1"

    class Config:
        """Pydantic model configuration."""

        env_file = ".env"


settings = Settings()
'''

"src/<% PACKAGE_NAME %>/main.py" = '''
"""Application entrypoint for <% PROJECT_NAME %>."""

from fastapi import FastAPI

from .core.config import settings

app = FastAPI(
    title=settings.project_name,
    openapi_url=f"{settings.api_v1_str}/openapi.json",
)


@app.get("/health")
async def health_check() -> dict[str, str]:
    """Health check endpoint."""
    return {"status": "ok"}
'''

".env.example" = '''
# API Configuration
PROJECT_NAME="<% PROJECT_NAME %>"
'''
