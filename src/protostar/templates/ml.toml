# Built-in template. Workbench tier: machine learning and data science, lean by default.
# Contract: docs/developer/built-in-templates.md

name = "ML"
description = "Machine learning & data science scaffold with PyTorch and Jupyter"

# --- Dependencies ---
dependencies = [
    "torch",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "tqdm",
]
docs_dependencies = ["jupyterlab", "nbdime", "ipywidgets"]

# --- Directory Architecture ---
directories = [
    "data/01_raw",
    "data/02_processed",
    "data/03_features",
    "models/weights",
    "notebooks/exploratory",
    "src/<% PACKAGE_NAME %>/data",
    "src/<% PACKAGE_NAME %>/models",
    "src/<% PACKAGE_NAME %>/training",
]

# --- Version Control Ignores ---
vcs_ignores = [
    "*.pt",
    "*.pth",
    "*.safetensors",
    "*.onnx",
    "*.log",
    "wandb/",
    "mlruns/",
    "runs/",
    "data/01_raw/*",
    "data/02_processed/*",
    "data/03_features/*",
    "!data/**/.gitkeep",
    ".ipynb_checkpoints/",
]

# --- Tooling Opinions ---
ruff = true
direnv = true
pytest = false
just = true
rumdl = false
mypy = false
prek = false
ci = false

# --- Post-Install Subprocesses ---
post_install_tasks = [["uv", "run", "nbdime", "config-git", "--enable"]]

# --- pyproject.toml AST Injections ---
# Configure Ruff to lint/format inside notebooks
[dev.pyproject.ml_ruff_config]
requires = "ruff"
content = '''
[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["NPY", "PD"] # NumPy and Pandas specific linting rules
'''

# --- Static File Injections ---
[files]
"data/01_raw/.gitkeep" = ""
"data/02_processed/.gitkeep" = ""
"data/03_features/.gitkeep" = ""
"models/weights/.gitkeep" = ""

".gitattributes" = '''
# Improve Jupyter Notebook diffs
*.ipynb text eol=lf
'''
