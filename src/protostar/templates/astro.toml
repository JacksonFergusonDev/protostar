# Built-in template. Workbench tier: astrophysics analysis, lean by default.
# Contract: docs/developer/built-in-templates.md

name = "Astro"
description = "Astrophysics and astronomy data analysis scaffold with Astropy"

# --- Dependencies ---
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "astropy",
    "astroquery",
    "photutils",
    "specutils",
]

# --- Directory Architecture ---
directories = ["data/catalogs", "data/fits", "notebooks", "src"]

# --- Version Control Ignores ---
vcs_ignores = [
    "*.fits",
    "*.fit",
    "*.fts",
    "*.csv",
    "*.parquet",
    ".ipynb_checkpoints/",
]

# --- Post-Install Subprocesses ---
post_install_tasks = [["uv", "run", "nbdime", "config-git", "--enable"]]

# --- Tooling Opinions ---
ruff = true
direnv = true
just = true
rumdl = false
mypy = false
pytest = false
prek = false
ci = false

# --- Development Dependencies ---
# Notebook tooling belongs in the dev group so it survives `just sync`.
[dev]
dev_dependencies = ["nbdime"]

# --- pyproject.toml AST Injections ---
[dev.pyproject.data_science_linting]
requires = "ruff"
content = '''
[tool.ruff.lint]
extend-select = ["PD", "NPY"]
'''

# --- Static File Injections ---
[files]
".gitattributes" = '''
# Astrophysics binary safety
*.fits binary
*.fit  binary
*.fts  binary

# Improve Jupyter Notebook diffs
*.ipynb text eol=lf
'''
