# --- Dependencies ---
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "astropy",
    "astroquery",
    "photutils",
    "specutils",
    "nbdime",
]

# --- Directory Architecture ---
directories = ["data/catalogs", "data/fits", "notebooks", "src"]

# --- Version Control Ignores ---
vcs_ignores = [
    "*.fits",
    "*.fit",
    "*.fts",
    "*.csv",
    "*.parquet",
    ".ipynb_checkpoints/",
]

# --- Post-Install Subprocesses ---
post_install_tasks = [["uv", "run", "nbdime", "config-git", "--enable"]]

# --- Tooling Opinions ---
ruff = true
direnv = true
mypy = false
pytest = false
pre_commit = false

# --- pyproject.toml AST Injections ---
[dev.pyproject]
data_science_linting = '''
[tool.ruff.lint]
extend-select = ["PD", "NPY"]
'''

# --- Static File Injections ---
[files]
".gitattributes" = '''
# Astrophysics binary safety
*.fits binary
*.fit  binary
*.fts  binary

# Improve Jupyter Notebook diffs
*.ipynb text eol=lf
'''
