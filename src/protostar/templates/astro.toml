dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "astropy",
    "astroquery",
    "photutils",
    "specutils",
    "nbdime",
]

directories = ["data/catalogs", "data/fits", "notebooks", "src"]

vcs_ignores = [
    "*.fits",
    "*.fit",
    "*.fts",
    "*.csv",
    "*.parquet",
    ".ipynb_checkpoints/",
]

post_install_tasks = [["uv", "run", "nbdime", "config-git", "--enable"]]

[env]
active_presets = ["astro"]

# Tooling opinions for a Jupyter/Scientific workflow
ruff = true
direnv = true
mypy = false
pytest = false
pre_commit = false

[dev.pyproject]
# Surgically append data-science specific linting rules to Ruff
# without destroying the baseline configuration.
#
data_science_linting = '''
[tool.ruff.lint]
extend-select = ["PD", "NPY"]
'''

[files]
".gitattributes" = '''
# Astrophysics binary safety
*.fits binary
*.fit  binary
*.fts  binary

# Improve Jupyter Notebook diffs
*.ipynb text eol=lf
'''
