name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --locked
          uv pip install pytest-github-actions-annotate-failures

      - name: Run MarkdownLint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: DavidAnson/markdownlint-cli2-action@v24

      - name: Run Ruff Linter
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff check --output-format=github .

      - name: Run Ruff Formatter
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run ruff format --check --output-format=github .

      - name: Run Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run mypy src/

      - name: Run tests with coverage # (for Codecov)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' }}
        run: uv run pytest --cov --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Run tests # (without coverage to avoid overhead on non-Codecov runs)
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14') }}
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          name: coverage
          fail_ci_if_error: true

      - name: Upload test analytics to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          disable_search: true
          report_type: test_results
          name: test-results
