# ==============================================================================
# Protostar Template Specification Schema
# ==============================================================================

# --- Dependencies ---
# Core runtime packages installed into the project environment.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

# Development packages not shipped to production.
dev_dependencies = [
    "pytest",
    "mypy",
    "ruff",
]

# Documentation toolchain dependencies.
docs_dependencies = [
    "mkdocstrings[python]",
    "zensical",
]

# --- Directory Architecture ---
# Relative directory paths scaffolded in the workspace.
directories = [
    "src/<% PACKAGE_NAME %>",
    "tests",
    "data/raw",
]

# --- Version Control Ignores ---
# Patterns appended and deduplicated in .gitignore.
vcs_ignores = [
    "*.log",
    ".env",
    "local_data/",
]

# --- Subprocess Tasks ---
# Commands executed before dependency installation.
system_tasks = [
    ["git", "init"],
]

# Commands executed after dependencies are installed.
post_install_tasks = [
    ["uv", "run", "nbdime", "config-git", "--enable"],
]

# --- Tooling Opinions & Overrides ---
# Boolean toggles configuring baseline tooling opinions.
# Dynamic precedence: CLI Flags > Template Opinions > Global UserConfig
ci = false
codecov = false
commitizen = false
direnv = false
just = false
markdownlint = false
mypy = false
pre_commit = false
prek = false
pyrefly = false
pytest = true
readthedocs = false
release = false
renovate = false
ruff = true
ty = false
zensical = false

# --- Static File Injections ---
# Exact file paths mapped to their raw template contents.

[files]
"README.md" = '''
# <% PROJECT_NAME %>

Auto-scaffolded using custom template.
'''
"src/<% PACKAGE_NAME %>/__init__.py" = '''
"""<% PROJECT_NAME %> package."""
__version__ = "0.1.0"
'''

# --- pyproject.toml AST Injections ---
# Arbitrary tables deep-merged into target pyproject.toml.

[dev.pyproject]
custom_linting = '''
[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
'''

# --- File Appends ---
# Lines appended to existing files, creating them if necessary.

[appends]
"pyproject.toml" = ["# Custom comment appended to bottom of pyproject.toml"]
