[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]
description = "Add your description here."
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Operating System :: MacOS", "Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows"]

[[project.authors]]
name = "your-name"
email = "your-email"
[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "prek>=0.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "rumdl>=0.2.64",
]

[tool.rumdl]
disable = ["MD013", "MD033", "MD077"]

[tool.rumdl.MD003]
style = "atx"

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD009]
br-spaces = 2
strict = false

[tool.rumdl.MD024]
siblings-only = true

[tool.rumdl.MD029]
style = "one"

[tool.rumdl.per-file-ignores]
"docs/**/*.md" = ["MD041", "MD046"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
pretty = true
show_error_codes = true
show_error_context = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
