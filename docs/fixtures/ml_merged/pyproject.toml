[project]
name = "demo-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]
description = "Add your description here."
readme = "README.md"

[[project.authors]]
name = "your-name"
email = "your-email"
[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "rumdl>=0.2.64",
]
docs = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "nbdime>=4.0.4",
]

[tool.rumdl]
disable = ["MD013", "MD033", "MD077"]

[tool.rumdl.MD003]
style = "atx"

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD009]
br-spaces = 2
strict = false

[tool.rumdl.MD024]
siblings-only = true

[tool.rumdl.MD029]
style = "one"

[tool.rumdl.per-file-ignores]
"docs/**/*.md" = ["MD041", "MD046"]

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
extend-select = ["NPY", "PD"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
pretty = true
show_error_codes = true
show_error_context = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
